# Nulo bridge L1 contracts (Foundry). Aztec L1 interfaces are remapped to the
# installed @aztec/l1-artifacts 4.2.0 sources — no aztec-contracts submodule.
[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.28"
via_ir = true

remappings = [
  "@oz/=lib/openzeppelin-contracts/contracts/",
  "@aztec/=../../node_modules/@aztec/l1-artifacts/l1-contracts/src/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@test/=test/",
  "forge-std/=lib/forge-std/src/",
]
