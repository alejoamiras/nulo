# Bun configuration. Docs: https://bun.com/docs/runtime/bunfig

[install]
# Supply-chain defense: block packages published in the last 7 days.
# Recent npm token-compromise attacks (axios 2026-03, chalk/debug 2025-09)
# were detected and pulled within hours-to-days; a 7-day window catches
# the publish-and-pull-within-hours attack pattern with margin.
#
# Why 7 days (was 14 in the original plan, then 3 after a Bun bug, now 7):
#
# Bun's docs (https://bun.com/docs/cli/install) state that
# `minimumReleaseAge` "only affects new package resolution - existing
# packages in bun.lock remain unchanged." Empirically on Bun 1.3.1 with
# this repo's lockfile, setting the value to 1209600 (14d) and running
# `bun install --frozen-lockfile` against an unchanged manifest fails
# with: `error: No version matching "puppeteer" found for specifier
# "^24.43.0" (blocked by minimum-release-age: 1209600 seconds)`.
# Puppeteer 24.43.1 is already pinned in the lockfile and `^24.43.0` is
# unchanged in the manifest — so the gate IS gating frozen-lockfile
# installs of currently-pinned versions, contrary to the docs.
#
# 7 days (604800s) is the widest gate that passes against the current
# lockfile today. Re-test wider windows when patch deps age or when Bun
# fixes the frozen-lockfile gate behavior upstream.
#
# CVE bypass: when an advisory drops for a package newer than the gate,
# temporarily add it to `minimumReleaseAgeExcludes` below, install the
# patched version, open a follow-up PR removing the exclude after the
# window passes. See SECURITY.md "Dependency policy".
#
# Bun bug #25305: `bun update --latest` does not apply this gate to
# transitive deps. Workaround for bulk re-resolves: delete bun.lock
# first.
#
# CLI equivalent: --minimum-release-age=604800
minimumReleaseAge = 604800

# Excludes:
# - puppeteer + its transitive deps: temporary. We want to ship puppeteer 25
#   today; all 25.x and its transitives (chromium-bidi 16.x,
#   @puppeteer/browsers 3.x, puppeteer-core 25.x) are inside the 7-day window
#   (25.0.0 = 2026-05-12). Once 25.0.0 ages out (~2026-05-19 16:08 UTC),
#   remove these entries in a follow-up.
# TEMPORARY (aztec-5.0-upgrade): all @aztec/* 5.0.0-rc.1 (published 2026-06-15) sit inside
# the 7-day window until ~2026-06-22, and this repo's Bun gates frozen-lockfile installs of
# pinned <min-age versions. Glob excludes are NOT supported, so the full first-party closure
# is enumerated below (incl. transitives surfaced by Bun #25305: builder, key-store, native,
# world-state, standard-contracts, …). The Phase-7 follow-up PR removes this @aztec/@alejoamiras
# block once 5.0.0-rc.1 ages out. @aztec/viem (2.38.2, not bumped) is intentionally omitted.
minimumReleaseAgeExcludes = [
	"puppeteer", "puppeteer-core", "@puppeteer/browsers", "chromium-bidi",
	"@alejoamiras/aztec-accelerator",
	"@aztec/accounts", "@aztec/aztec.js", "@aztec/bb-prover", "@aztec/bb.js",
	"@aztec/blob-lib", "@aztec/builder", "@aztec/constants", "@aztec/entrypoints",
	"@aztec/ethereum", "@aztec/foundation", "@aztec/key-store", "@aztec/kv-store",
	"@aztec/l1-artifacts", "@aztec/native", "@aztec/noir-acvm_js",
	"@aztec/noir-contracts.js", "@aztec/noir-noir_codegen", "@aztec/noir-noirc_abi",
	"@aztec/noir-protocol-circuits-types", "@aztec/noir-types",
	"@aztec/protocol-contracts", "@aztec/pxe", "@aztec/simulator",
	"@aztec/sqlite3mc-wasm", "@aztec/standard-contracts", "@aztec/stdlib",
	"@aztec/telemetry-client", "@aztec/wallet-sdk", "@aztec/wallets",
	"@aztec/world-state",
]
