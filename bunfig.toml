	"@aztec/entrypoints",
	"@aztec/ethereum",
	"@aztec/foundation",
	"@aztec/key-store",
	"@aztec/kv-store",
	"@aztec/l1-artifacts",
	"@aztec/native",
	"@aztec/noir-acvm_js",
