# Bun configuration. Docs: https://bun.com/docs/runtime/bunfig

[install]
# Keep the classic hoisted node_modules layout. A fresh lockfile on Bun 1.3.13 defaults new
# workspace resolutions to the ISOLATED linker (per-workspace symlink trees + a .bun store),
# which breaks this repo's hoisting assumptions: the foundry `@aztec/` remap into root
# node_modules, resolvePackageFile walkers, and the bridge-core deploy-script paths.
linker = "hoisted"

# Supply-chain defense: block packages published in the last 7 days.
# Recent npm token-compromise attacks (axios 2026-03, chalk/debug 2025-09)
# were detected and pulled within hours-to-days; a 7-day window catches
# the publish-and-pull-within-hours attack pattern with margin.
#
# Why 7 days (was 14 in the original plan, then 3 after a Bun bug, now 7):
#
# Bun's docs (https://bun.com/docs/cli/install) state that
# `minimumReleaseAge` "only affects new package resolution - existing
# packages in bun.lock remain unchanged." Empirically on Bun 1.3.1 with
# this repo's lockfile, setting the value to 1209600 (14d) and running
# `bun install --frozen-lockfile` against an unchanged manifest fails
# with: `error: No version matching "puppeteer" found for specifier
# "^24.43.0" (blocked by minimum-release-age: 1209600 seconds)`.
# Puppeteer 24.43.1 is already pinned in the lockfile and `^24.43.0` is
# unchanged in the manifest — so the gate IS gating frozen-lockfile
# installs of currently-pinned versions, contrary to the docs.
#
# 7 days (604800s) is the widest gate that passes against the current
# lockfile today. Re-test wider windows when patch deps age or when Bun
# fixes the frozen-lockfile gate behavior upstream.
#
# CVE bypass: when an advisory drops for a package newer than the gate,
# temporarily add it to `minimumReleaseAgeExcludes` below, install the
# patched version, open a follow-up PR removing the exclude after the
# window passes. See SECURITY.md "Dependency policy".
#
# Bun bug #25305: `bun update --latest` does not apply this gate to
# transitive deps. Workaround for bulk re-resolves: delete bun.lock
# first.
#
# CLI equivalent: --minimum-release-age=604800
minimumReleaseAge = 604800

# Excludes (the ONLY packages exempt from the 7-day gate). Name-based, so they cover the 5.0.1
# client re-resolution too:
# - The @aztec/* 5.0.1 client set (names incl. transitives, enumerated from the lockfile — the
#   gate bites ANY fresh resolution, not just direct pins): 5.0.1 published 2026-07-15, ages out
#   ~2026-07-22. TEMPORARY — remove in a follow-up PR after that date. Provenance is checked at
#   bump time instead (npm audit signatures + attestations; see the aztec-update skill +
#   implementations-plan/aztec-5.0.1-line/).
# - @alejoamiras/aztec-accelerator: 5.0.1 published 2026-07-16, ages out ~2026-07-23. Same
#   follow-up removes it. @alejoamiras/aztec-{standards,fee-payment} STAY 5.0.0 this phase
#   (identity-coupled — they move to @aztec-foundation / 5.0.1 in P4, re-dated there).
# The puppeteer closure (aged out 2026-05) and the rc.1 set were dropped once past the
# window. On Bun 1.3.13+ a frozen-lockfile install of already-pinned versions doesn't trip
# the gate; it only bites active re-resolution, so dropping aged-out excludes is safe.
minimumReleaseAgeExcludes = [
	"@alejoamiras/aztec-accelerator",
	"@alejoamiras/aztec-standards",
	"@alejoamiras/aztec-fee-payment",
	"@aztec/accounts",
	"@aztec/aztec.js",
	"@aztec/bb-prover",
	"@aztec/bb.js",
	"@aztec/blob-lib",
	"@aztec/builder",
	"@aztec/constants",
	"@aztec/entrypoints",
	"@aztec/ethereum",
	"@aztec/foundation",
	"@aztec/key-store",
	"@aztec/kv-store",
	"@aztec/l1-artifacts",
	"@aztec/native",
	"@aztec/noir-acvm_js",
	"@aztec/noir-contracts.js",
	"@aztec/noir-noir_codegen",
	"@aztec/noir-noirc_abi",
	"@aztec/noir-protocol-circuits-types",
	"@aztec/noir-types",
	"@aztec/protocol-contracts",
	"@aztec/pxe",
	"@aztec/simulator",
	"@aztec/sqlite3mc-wasm",
	"@aztec/standard-contracts",
	"@aztec/stdlib",
	"@aztec/telemetry-client",
	"@aztec/wallet-sdk",
	"@aztec/wallets",
	"@aztec/world-state",
]
