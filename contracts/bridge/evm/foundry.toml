# Nulo bridge L1 contracts (Foundry). Aztec L1 interfaces are remapped to the
# installed @aztec/l1-artifacts sources — no aztec-contracts submodule.
# The static @aztec/ remap below assumes the HOISTED node_modules layout. Under
# the isolated linker, run `bun scripts/gen-remappings.ts` from
# packages/bridge-core first: it writes remappings.txt (gitignored), which
# Foundry gives priority over these TOML remappings, with the @aztec/ path
# resolved through bridge-core's declared dependency. verify-l1.ts does this
# automatically and asserts the effective mapping via `forge remappings`.
[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.28"
via_ir = true

remappings = [
  "@oz/=lib/openzeppelin-contracts/contracts/",
  "@aztec/=../../../node_modules/@aztec/l1-artifacts/l1-contracts/src/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@test/=test/",
  "forge-std/=lib/forge-std/src/",
]
