<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Nulo V6 small promo tile</title>
		<style>
			@font-face {
				font-family: "Space Grotesk";
				font-weight: 300 700;
				src: url("{{font}}") format("woff2");
			}
			@font-face {
				font-family: "JetBrains Mono";
				font-weight: 400 700;
				src: url("{{mono}}") format("woff2");
			}
			html,
			body {
				margin: 0;
				width: 440px;
				height: 280px;
				overflow: hidden;
			}
			body {
				position: relative;
				background: radial-gradient(circle at 26% 50%, rgba(255, 85, 0, 0.14), transparent 46%), #0a0908;
				color: #f5f0e6;
				font-family: "Space Grotesk", sans-serif;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 28px;
			}
			.ring {
				width: 96px;
				height: 96px;
				border: 8px solid #f5f0e6;
				border-radius: 50%;
				box-sizing: border-box;
			}
			.wordmark {
				font-size: 56px;
				font-weight: 600;
				letter-spacing: 0.08em;
				line-height: 1;
			}
			.wordmark .version {
				color: #ff5500;
			}
			.wordmark small {
				display: block;
				margin-top: 12px;
				font-family: "JetBrains Mono", monospace;
				font-size: 13px;
				font-weight: 500;
				letter-spacing: 0.2em;
				color: #999187;
			}
		</style>
	</head>
	<body>
		<div class="ring"></div>
		<div class="wordmark">NULO <span class="version">V6</span><small>PRIVATE AZTEC WALLET</small></div>
	</body>
</html>
