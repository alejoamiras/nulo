name: _Network e2e (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout.
        required: false
        type: string
        default: ""
      aztec_node_url:
        description: |
          Aztec node URL. When localhost, sets up a local sandbox via setup-aztec.
          When remote, skips local CLI install (future-proofs remote-network runs).
        required: false
        type: string
        default: "http://localhost:8080"
    secrets:
      SPONSORED_FPC_SALT:
        required: false

jobs:
  network-e2e:
    name: Aztec agent
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AZTEC_NODE_URL: ${{ inputs.aztec_node_url }}
      SPONSORED_FPC_SALT: ${{ !contains(inputs.aztec_node_url, 'localhost') && secrets.SPONSORED_FPC_SALT || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-bun

      - uses: ./.github/actions/setup-aztec
        with:
          skip_cli: ${{ inputs.aztec_node_url != 'http://localhost:8080' }}

      - uses: ./.github/actions/setup-puppeteer

      - name: Run network e2e via agent
        run: bun run e2e:agent

      - name: Upload network e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: network-e2e-logs
          path: |
            packages/extension/.e2e-state
            /tmp/aztec-*.log
            /tmp/anvil-*.log
          if-no-files-found: ignore
          retention-days: 7
