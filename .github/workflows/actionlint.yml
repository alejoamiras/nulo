name: Lint workflows

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]

concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      workflows: ${{ steps.override.outputs.workflows || steps.filter.outputs.workflows }}
      shell: ${{ steps.override.outputs.shell || steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
            shell:
              - 'apps/extension/scripts/**/*.sh'
              - 'apps/extension/scripts/**/*.bash'
              - 'scripts/**/*.sh'
              - 'scripts/**/*.bash'
              - '.githooks/**'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: |
          {
            echo "workflows=true"
            echo "shell=true"
          } >> "$GITHUB_OUTPUT"

  actionlint:
    name: Actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Replaces the prior `bash <(curl -fsSL ...download-actionlint.bash)` —
      # SHA-pinned Marketplace action eliminates the curl|bash supply-chain
      # surface. The action handles caching internally.
      - uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          fail_on_error: true

  shellcheck:
    name: Shellcheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: |
          shopt -s globstar nullglob
          mapfile -t FILES < <(find .githooks apps/extension/scripts scripts -type f \( -name '*.sh' -o -name '*.bash' \) 2>/dev/null)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No shell files found to lint."
            exit 0
          fi
          shellcheck "${FILES[@]}"
        shell: bash

  status:
    name: Status
    if: always()
    needs: [changes, actionlint, shellcheck]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check results
        run: |
          for r in \
            "${{ needs.changes.result }}" \
            "${{ needs.actionlint.result }}" \
            "${{ needs.shellcheck.result }}" \
          ; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "All checks passed (or skipped — no relevant changes)."
