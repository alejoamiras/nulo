name: publish-packages
run-name: "publish-packages → ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}"

# Publishes @alejoamiras/nulo-{wallet-crypto,resolve-asset,wallet-sdk-schema-patch} at one lockstep
# version through npm trusted publishing: no npm token exists anywhere.
# - `build` holds no credential: it tests, stages and packs, and refuses tarballs that differ from
#   scripts/publish/approved-digests.json (the first publication must be listed there).
# - `publish` holds the only `id-token: write`, runs in the `npm-publish` environment (owner approval;
#   its deployment branches, dev and main, bound the ref) and runs no repository code: one data file,
#   Node, the artifact, npm.
# Each package's npm trusted-publisher record names this file and that environment, so renaming
# either stops publishing. Node is pinned exactly because the approved digests were computed with
# this Node's npm and zlib.
#
# `gh workflow run publish-packages.yml --ref dev -f version=X.Y.Z` (a dry run unless -f dry_run=false)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Lockstep version for all three packages (X.Y.Z)"
        required: true
        type: string
      dry_run:
        description: "Test, stage, pack and compare digests only; the publish job does not run."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  build:
    name: test, stage and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.input.outputs.version }}
    steps:
      - name: Check the ref and version
        id: input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/dev | refs/heads/main) ;;
            *) echo "::error::dispatch from dev or main, not $GITHUB_REF"; exit 1 ;;
          esac
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z, got '$VERSION'"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0

      - uses: ./.github/actions/setup-bun

      - name: Release and publish tests
        run: bun run test:release

      - name: Stage and pack
        env:
          VERSION: ${{ steps.input.outputs.version }}
        run: |
          bun scripts/publish/stage.ts --all --version "$VERSION"
          mkdir -p "$RUNNER_TEMP/tgz"
          for pkg in wallet-crypto resolve-asset wallet-sdk-schema-patch; do
            npm pack "./dist-publish/$pkg" --pack-destination "$RUNNER_TEMP/tgz" --ignore-scripts
          done

      - name: Compare with the approved digests
        env:
          VERSION: ${{ steps.input.outputs.version }}
        run: |
          bun scripts/publish/check-digests.ts "$VERSION" "$RUNNER_TEMP/tgz"
          {
            echo "## publish-packages $VERSION"
            echo "- commit \`$GITHUB_SHA\` on \`$GITHUB_REF_NAME\`"
            echo "- node $(node --version), npm $(npm --version), bun $(bun --version)"
            for f in "$RUNNER_TEMP"/tgz/*.tgz; do
              echo "- \`$(basename "$f")\` sha256 \`$(sha256sum "$f" | cut -d' ' -f1)\` integrity \`sha512-$(openssl dgst -sha512 -binary "$f" | base64 -w0)\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tgz/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm (${{ needs.build.outputs.version }})
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/publish/approved-digests.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tgz

      - name: Publish
        working-directory: ${{ runner.temp }}/tgz
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          printf '11.5.1\n%s\n' "$(npm --version)" | sort -V -C || { echo "::error::npm $(npm --version) predates trusted publishing"; exit 1; }
          # The same binding as scripts/publish/check-digests.ts, re-checked on the downloaded bytes.
          approved=$(jq -r --arg v "$VERSION" '.[$v] // empty | to_entries[] | "\(.value)  \(.key)"' "$GITHUB_WORKSPACE/scripts/publish/approved-digests.json")
          if [ -n "$approved" ]; then
            [ "$(printf '%s\n' "$approved" | wc -l)" = "$(find . -maxdepth 1 -name '*.tgz' | wc -l)" ] || { echo "::error::the tarball set differs from the approved set"; exit 1; }
            printf '%s\n' "$approved" | sha256sum -c --strict -
          elif [ "$VERSION" = "0.1.0" ]; then
            echo "::error::0.1.0 is the first publication and has no approved digests"
            exit 1
          fi
          for tgz in *.tgz; do
            manifest=$(tar -xOzf "$tgz" package/package.json)
            name=$(jq -r .name <<< "$manifest")
            case "$name" in
              @alejoamiras/nulo-wallet-crypto | @alejoamiras/nulo-resolve-asset | @alejoamiras/nulo-wallet-sdk-schema-patch) ;;
              *) echo "::error::unexpected package $name"; exit 1 ;;
            esac
            [ "$(jq -r .version <<< "$manifest")" = "$VERSION" ] || { echo "::error::$tgz is not $VERSION"; exit 1; }
            integrity="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
            remote=$(npm view "$name@$VERSION" dist.integrity 2> /dev/null || true)
            if [ -n "$remote" ]; then
              [ "$remote" = "$integrity" ] || { echo "::error::$name@$VERSION is already published with other bytes"; exit 1; }
              echo "$name@$VERSION is already published with these bytes"
              continue
            fi
            # Verbose: npm reports a failed OIDC exchange only at this level, then fails with ENEEDAUTH.
            npm publish "$tgz" --provenance --access public --ignore-scripts --loglevel verbose
          done
