name: _Extension network e2e (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout.
        required: false
        type: string
        default: ""
      aztec_node_url:
        description: |
          Aztec node URL. When localhost, sets up a local sandbox via setup-aztec.
          When remote, skips local CLI install (future-proofs remote-network runs).
        required: false
        type: string
        default: "http://localhost:8080"
      shard:
        description: |
          vitest --shard expression (e.g. "1/5"). Empty string runs the full suite.
          Caller workflows use this with a matrix strategy to parallelize across
          runners; each shard runs its own anvil + aztec sandbox.
        required: false
        type: string
        default: ""
      shard_label:
        description: |
          Artifact-safe label for the shard (e.g. "1-of-5"). actions/upload-artifact
          rejects `/` in artifact names, so the caller passes a separate label
          here distinct from the `shard` input's vitest expression. Empty falls
          back to "full" for the unsharded invocation.
        required: false
        type: string
        default: ""
      probe:
        description: |
          Set to "1" when this workflow run is intentionally running with probes on
          (slow-test investigation). The bundle-grep guard skips when "1" because
          the build will legitimately contain probe strings. Default empty runs
          the guard, which fails the workflow if probe strings ship in dist/chrome.
        required: false
        type: string
        default: ""
      test_files:
        description: |
          Explicit space-separated list of test files to run, passed straight to
          vitest as positional args. Used by the dedicated heavy-network job to
          run e.g. tests/e2e/network/fee-methods.test.ts alone, separated from
          the SHA-1-distributed matrix shards so it doesn't pre-pressure the
          prover queue for popup-shape tests sharing the same shard host.
          Leave empty for the default (sharded) suite distribution.
        required: false
        type: string
        default: ""
      exclude_files:
        description: |
          Space-separated --exclude patterns passed to vitest. Used by the
          lightweight matrix shards to exclude heavy-network files that are
          run in a dedicated job (see test_files). Without this, an excluded
          file would still consume one slot in the SHA-1 shard distribution.
        required: false
        type: string
        default: ""
      disable_presto:
        description: |
          Skip presto-server install + startup + hard-fail enforcement.
          Wallet falls back to in-browser WASM proving.
          Rollback flag for emergencies. See CI.md "Presto in CI".
        required: false
        type: boolean
        default: false
      proverless:
        description: |
          Build the wallet with NULO_E2E_PROVERLESS=1 (skip BB-SNARK
          generation; kernel sim + on-chain submission stay real). Implies
          Presto OFF (proverless ⊥ presto-required). Used by the
          shard pool + STUB barrier jobs; the prover-ON canary jobs leave it
          false. See implementations-plan/e2e-proverless-stub.
        required: false
        type: boolean
        default: false
      retry:
        description: |
          Override the vitest `retry` count via NULO_E2E_RETRY. Empty = config
          default (3 attempts). The soak workflow passes "0" so a test that
          passes only on a retry FAILS the iteration ("zero retries consumed").
        required: false
        type: string
        default: ""
      browser:
        description: |
          chrome | firefox. Firefox adds geckodriver and the Firefox build; every name a run
          publishes (logs artifact, browser cache) carries the browser so lanes never collide.
        required: false
        type: string
        default: chrome
    secrets:
      SPONSORED_FPC_SALT:
        required: false

jobs:
  network-e2e:
    name: ${{ inputs.shard && format('Aztec agent (shard {0})', inputs.shard) || 'Aztec agent' }}
    runs-on: ubuntu-latest
    # Per-shard wall-time worst case is ~20m (9 files + cold-start ~5m). 30m
    # budget gives headroom without masking real hangs. Was 60m for the single
    # unsharded job; that ceiling no longer applies.
    timeout-minutes: 30
    env:
      NULO_E2E_BROWSER: ${{ inputs.browser }}
      AZTEC_NODE_URL: ${{ inputs.aztec_node_url }}
      SPONSORED_FPC_SALT: ${{ !contains(inputs.aztec_node_url, 'localhost') && secrets.SPONSORED_FPC_SALT || '' }}
      # Baked into the wallet build at `bun run build:chrome` time (via the
      # agent.sh subprocess). When "1", `apps/extension/src/presto/config.ts`
      # sets `PRESTO_REQUIRED=true`, which makes the offscreen factory
      # construct `ProductionPxeFactory` in required-mode (plain HTTP to the
      # headless server, eager checkPrestoStatus preflight + onPhase throw on
      # every fallback-class phase). When empty, the wallet behaves exactly
      # like the production build (HTTPS-only, silent WASM fallback).
      #
      # Expression shape `disable_presto == false && '1' || ''` instead
      # of the inverted form: GitHub Actions short-circuits `&&` such that
      # `true && ''` returns `''` (right operand), and then `'' || '1'`
      # falls through to `'1'` because empty string is falsy. So the inverted
      # form would resolve to `'1'` in BOTH branches, completely defeating
      # the disable flag (codex post-impl audit finding #1).
      # Presto-required ONLY when not disabled AND not proverless (proverless
      # ⊥ presto — the offscreen would FATAL on both). Same short-circuit
      # shape as the disable flag (`(A && B) && '1' || ''` → '1' iff both true).
      VITE_NULO_PRESTO_REQUIRED: ${{ (inputs.disable_presto == false && inputs.proverless == false) && '1' || '' }}
      # Proverless build flag, read by agent.sh (arms the double-opt-in VITE
      # flags + asserts the positive build stamp). '1' iff proverless.
      NULO_E2E_PROVERLESS: ${{ inputs.proverless && '1' || '' }}
      # Override vitest retry. Empty leaves the config default (3 attempts; the
      # vitest config treats "" as default). The soak passes "0" so a retry-passed
      # test FAILS the iteration — the "zero retries consumed" acceptance gate.
      NULO_E2E_RETRY: ${{ inputs.retry }}
      # Widen the wallet's maxFeesPerGas envelope for e2e only. Devnet
      # base-fees drift on loaded GHA runners; multi-prove tests
      # (transfers, concurrent-sendtx-confirm) hit `maxFeesPerGas <
      # gasFees` at inclusion. First attempt at 4× still missed (observed
      # ~9× base-fee climb during a single test). Bumping to 10× to give
      # the heavy multi-prove paths real headroom. Production stays at
      # the upstream default of 2 (no env var set).
      VITE_NULO_FEE_MULTIPLIER: "10"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-bun

      - uses: ./.github/actions/setup-aztec
        with:
          skip_cli: ${{ inputs.aztec_node_url != 'http://localhost:8080' }}

      # The suite rejects an unknown browser too, but only after the sandbox has been paid for.
      - name: Validate the browser input
        env:
          BROWSER: ${{ inputs.browser }}
        run: |
          case "$BROWSER" in
            chrome|firefox) ;;
            *) echo "::error::browser must be chrome or firefox, got '$BROWSER'"; exit 1 ;;
          esac

      - uses: ./.github/actions/setup-puppeteer
        with:
          browser: ${{ inputs.browser }}

      - uses: ./.github/actions/setup-geckodriver
        if: inputs.browser == 'firefox'

      # Install + verify + start presto-server. Skipped when the rollback
      # flag is set; in that case the wallet build's VITE_NULO_PRESTO_REQUIRED
      # is also empty so chain-runtime.ts behaves like production (HTTPS-only,
      # silent WASM fallback).
      - uses: ./.github/actions/setup-presto-server
        if: '${{ !inputs.disable_presto && !inputs.proverless }}'
        with:
          # Headless server; bb is fetched per the SDK-requested version
          # (x-aztec-version) and cached in ~/.presto/versions/.
          version: "1.1.1"
          # Both pins, established from the release assets (the tarball is
          # checked before extraction; the extracted binary on every run,
          # cache hits included). See SECURITY.md "Binary dependencies".
          expected_tarball_sha256: 48f524b159fe84947f767ca2903e06c82eb555eec99ab46052cb3d92bd1b33ef
          expected_sha256: 7c866bac4023d480de7a0d6a5ad2069ba23979d01fe248a780daad2f369eecdb

      - name: Start presto-server
        if: '${{ !inputs.disable_presto && !inputs.proverless }}'
        env:
          # The workflow token, renamed so it reaches ONLY the server process below and not
          # every command in this step. Presto looks up the bb release asset's published
          # SHA-256 on the GitHub API before downloading it, and an anonymous caller draws on
          # a 60-request-per-hour budget shared by source address, which runners exhaust
          # between themselves: the lookup then fails and the shard proves nothing
          # (`Cannot verify bb v<x>: no digest available from GitHub API`). Read access to a
          # public repository's releases is all this needs, so the default token suffices and
          # a fork PR's read-only one works too. Presto refuses redirects on that request, so
          # the credential reaches api.github.com and nowhere else.
          PRESTO_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # All three variables are scoped to the server PROCESS, never the job: RUST_LOG=info
          # carries the per-prove lines the assertion step greps; PRESTO_ALLOW_ALL=1
          # approves every browser origin because the wallet proves from
          # chrome-extension://<id>, an origin unknowable before Chrome loads the unpacked
          # build (the server denies non-localhost origins by default). Safe on a
          # loopback-only server on a single-tenant runner where fork PRs receive no
          # secrets (SECURITY.md).
          # Never seed BB_BINARY_PATH: Presto's find_bb honours it before the versioned
          # cache, so a mismatched seed would prove every request with the wrong bb while
          # the log shows a download of the right one.
          RUST_LOG=info PRESTO_ALLOW_ALL=1 GITHUB_TOKEN="${PRESTO_GITHUB_API_TOKEN}" \
            nohup presto-server > /tmp/presto-server.log 2>&1 &
          echo "PRESTO_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for presto-server ready (Layer 1 preflight)
        if: '${{ !inputs.disable_presto && !inputs.proverless }}'
        shell: bash
        run: |
          set -euo pipefail
          for _i in $(seq 1 30); do
            # The origin-tiered /health serves the detailed body (bb_available) to a request
            # without an Origin header, which curl sends none of.
            if curl -sSfL http://127.0.0.1:59833/health > /tmp/presto-health.json 2>/dev/null; then
              # bb_available is the authoritative liveness signal. Version-
              # cache matching is enforced later by Layer 2's eager
              # checkPrestoStatus in chain-runtime.ts, where the error
              # message names the reason (clearer than a workflow-level jq failure).
              if jq -e '.bb_available == true' /tmp/presto-health.json > /dev/null; then
                echo "Presto ready: $(cat /tmp/presto-health.json)"
                exit 0
              fi
              echo "::error::presto-server alive but bb_available != true"
              cat /tmp/presto-health.json
              tail -30 /tmp/presto-server.log || true
              exit 1
            fi
            sleep 1
          done
          echo "::error::presto-server failed to come up in 30s"
          tail -50 /tmp/presto-server.log || true
          exit 1

      - name: Run network e2e via agent
        env:
          EXCLUDE_FILES: ${{ inputs.exclude_files }}
          TEST_FILES: ${{ inputs.test_files }}
          SHARD: ${{ inputs.shard }}
        run: |
          # Use bash arrays + read -ra so word-splitting is explicit + scoped
          # (avoids shellcheck SC2086 noise on intentional split-into-flags).
          read -ra EXCLUDE_LIST <<< "$EXCLUDE_FILES"
          read -ra TEST_FILE_LIST <<< "$TEST_FILES"
          EXCLUDE_ARGS=()
          for f in "${EXCLUDE_LIST[@]}"; do
            [ -n "$f" ] && EXCLUDE_ARGS+=(--exclude "$f")
          done

          run_agent() {
            if [ "${#TEST_FILE_LIST[@]}" -gt 0 ] && [ -n "${TEST_FILE_LIST[0]}" ]; then
              # Dedicated mode: caller specified explicit test files. Ignore shard;
              # the file list IS the workload.
              bun run e2e:agent "${TEST_FILE_LIST[@]}" "${EXCLUDE_ARGS[@]}"
            elif [ -n "$SHARD" ]; then
              bun run e2e:agent --shard="$SHARD" "${EXCLUDE_ARGS[@]}"
            else
              bun run e2e:agent "${EXCLUDE_ARGS[@]}"
            fi
          }

          # Boot-failure sentinel: agent.sh exits 86 ONLY when the sandbox
          # (anvil/node/deploy bring-up) never became ready AND no test ran.
          # Retry the agent ONCE for that narrow infra window; any other non-zero
          # is a real failure and fails immediately. Cap = 1. No test-dimension
          # retry — the PR gate runs retry: 0 so app flakes surface honestly.
          set +e
          run_agent
          CODE=$?
          set -e
          if [ "$CODE" -eq 86 ]; then
            echo "::warning::Infra boot failure (exit 86) — retrying the agent once."
            set +e
            run_agent
            CODE=$?
            set -e
            if [ "$CODE" -eq 86 ]; then
              echo "::error::Infra boot failed again on retry (exit 86)."
            fi
          fi
          exit "$CODE"

      # Permanent guard: PR #46's lessons doc flagged bundle-grep as the actual
      # leak guarantee for diagnostic probes (compile-time gate is design intent,
      # not safety property). Probes accidentally surviving to dist/chrome would
      # leak protocol details to browser consoles in production. Skip the guard
      # when `inputs.probe == '1'` because slow-test investigation builds
      # legitimately contain probe strings.
      - name: Verify no probe code in shipped bundle
        if: always() && inputs.probe != '1'
        shell: bash
        env:
          BROWSER: ${{ inputs.browser }}
        run: |
          cd apps/extension
          # grep exits 1 on no-match; with `set -e -o pipefail` that aborts the
          # script before the `HITS > 0` check, so wrap the pipeline in `|| true`.
          HITS=$( { grep -RnE '(PROBE|nulo:probe:|VITE_E2E_PROBE)' "dist/${BROWSER}" 2>/dev/null || true; } | wc -l | tr -d ' ')
          if [ "$HITS" -gt 0 ]; then
            echo "::error::Probe strings found in built bundle ($HITS hits)."
            grep -RnE '(PROBE|nulo:probe:|VITE_E2E_PROBE)' "dist/${BROWSER}" | head -20
            exit 1
          fi
          echo "Bundle clean: no probe strings."

      # Zero SUCCESSFUL native proofs in a canary-lane run means the native lane was
      # bypassed — server-side evidence complementing Layer 2's in-page hard-fail.
      # The gate counts "Proving succeeded" ("Received /prove request" logs before
      # authorization or proving) and enforces only canary lanes: soak/dispatch lanes
      # may legitimately run non-proving file sets with Presto up. The in-test
      # native assertions (data-backend="presto") hold on every prover-ON lane.
      - name: Assert presto activity (enforced in canary lanes)
        if: ${{ always() && !cancelled() && !inputs.disable_presto && !inputs.proverless }}
        shell: bash
        env:
          SHARD_LABEL: ${{ inputs.shard_label }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/presto-server.log ]; then
            echo "::error::presto-server log missing — startup failure"
            exit 1
          fi
          # Literals from presto-v1.1.1 packages/presto/core/src/server/prove.rs:283,:475.
          PROVE_COUNT=$(grep -c 'Received /prove request' /tmp/presto-server.log || true)
          PROVE_SUCCESS=$(grep -c 'Proving succeeded' /tmp/presto-server.log || true)
          echo "::notice::presto-server log: ${PROVE_COUNT} /prove requests, ${PROVE_SUCCESS} successful proofs"
          echo "PROVE_SUCCESS=${PROVE_SUCCESS}"
          {
            echo "### presto-server activity"
            echo "- /prove request lines: ${PROVE_COUNT}"
            echo "- successful proofs: ${PROVE_SUCCESS}"
            echo "- log size: $(wc -c < /tmp/presto-server.log) bytes"
            echo "- last 5 lines:"
            echo '```'
            tail -5 /tmp/presto-server.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PROVE_SUCCESS" -eq 0 ] && [ "$SHARD_LABEL" = "canary" ]; then
            echo "::error::canary lane finished with ZERO successful native proofs — the native proving lane was bypassed."
            tail -30 /tmp/presto-server.log || true
            exit 1
          fi

      - name: Shut down presto-server
        if: ${{ always() && !inputs.disable_presto && !inputs.proverless }}
        shell: bash
        run: |
          if [ -n "${PRESTO_PID:-}" ]; then
            kill -TERM "${PRESTO_PID}" 2>/dev/null || true
            wait "${PRESTO_PID}" 2>/dev/null || true
          fi
          pkill -TERM presto-server 2>/dev/null || true

      - name: Upload network e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Use shard_label (e.g. "1-of-5") not shard ("1/5") — upload-artifact
          # rejects `/` in names (actions/upload-artifact#647).
          name: network-e2e-logs-${{ inputs.browser != 'chrome' && format('{0}-', inputs.browser) || '' }}${{ inputs.shard_label || 'full' }}
          path: |
            apps/extension/.e2e-state
            /tmp/aztec-*.log
            /tmp/anvil-*.log
            /tmp/nulo-probes-*.jsonl
            /tmp/presto-server.log
            /tmp/presto-health.json
          if-no-files-found: ignore
          retention-days: 7
