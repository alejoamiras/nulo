name: _Lint and typecheck (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout.
        required: false
        type: string
        default: ""

# Read-only job: it lints, typechecks, and audits — it never writes to the repo,
# so the token gets the least-privilege default explicitly.
permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Biome + vue-tsc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-bun

      # Restore the incremental tsc build-info so vue-tsc can do per-file
      # delta work instead of full re-typecheck. Key on toolchain/config
      # only — the tsbuildinfo's internal per-file signatures handle the
      # source-change tracking. Restore-keys lets branch history fall back
      # to the nearest stored state.
      - uses: actions/cache@v6
        with:
          path: apps/extension/tsconfig.tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-${{ hashFiles('bun.lock', 'tsconfig.json', 'apps/extension/tsconfig.json', 'apps/extension/package.json') }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-

      - name: Biome check
        run: bun run lint

      # Defensive review-time guard, NOT a security boundary. The
      # accelerator-required CI mode (chain-runtime.ts onPhase throw) is
      # bypassed by calling `prover.setForceLocal(true)` on the SDK's
      # AcceleratorProver. We don't expect production code to ever call
      # this — fail loud if it appears outside test files. Bracket access
      # like `prover["setForceLocal"](true)` bypasses this grep; we accept
      # that because this is review defense, not a hard constraint. Biome
      # has no AST-call matcher in our version (only noRestrictedGlobals
      # / Imports / Types), so a grep is the honest tool here.
      # See implementations-plan/accelerator-server-ci/plan.md §7.
      - name: Forbid setForceLocal outside test files
        shell: bash
        run: |
          set -euo pipefail
          HITS=$( {
            grep -RnE 'setForceLocal\b' \
              --include='*.ts' --include='*.vue' \
              --exclude-dir='node_modules' --exclude-dir='dist' \
              apps/ packages/ 2>/dev/null \
            | grep -vE '(__tests__|\.test\.ts|\.spec\.ts)' \
            || true
          } )
          if [ -n "$HITS" ]; then
            echo "::error::setForceLocal called outside test files — would bypass accelerator-required CI enforcement"
            echo "$HITS"
            exit 1
          fi

      # Catches malformed/deprecated Renovate config keys. Does NOT catch
      # semantic issues like packageRules precedence bugs or the bun
      # packageManager / setup-bun action drift — those need manual review.
      # Runs via bunx since Bun 1.4: the re2 native binding that segfaulted
      # under Bun 1.3.x's loader loads cleanly on the Node-26 addon line
      # (verified warm + cold cache). The renovate version stays pinned, but
      # its TRANSITIVE closure is resolved fresh at run time — exactly as it
      # was under npx; neither runner applies bunfig's minimumReleaseAge here.
      # Accepted + documented (owner ruling A4, bun-1.4-bump plan): vendoring
      # renovate into the lockfile for one config check isn't worth the tree.
      # --strict fails on any warning. --no-global forces repo-config
      # validation semantics (default treats a filename argument as
      # global/self-hosted config).
      - name: Renovate config validator
        run: bunx --package renovate@43.150.0 renovate-config-validator --strict --no-global renovate.json

      - name: Typecheck all packages
        run: bun run typecheck:all

      # `bun dedupe --check` is advisory: it reds when the lockfile carries two
      # versions of one package, but collapsing resolves to the RANGE
      # INTERSECTION — which can silently DOWNGRADE transitives — and
      # update→dedupe can oscillate. So a human reviews each collapse; this
      # step only surfaces drift in the step summary. Deliberate future flip
      # to blocking once a downgrade policy exists.
      - name: bun dedupe check (advisory)
        if: always()
        continue-on-error: true
        run: |
          set +e
          bun dedupe --check > /tmp/dedupe.txt 2>&1
          code=$?
          set -e
          {
            echo "## bun dedupe --check (advisory, exit=$code)"
            echo ""
            echo '```'
            cat /tmp/dedupe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      # `bun audit` is advisory: surfaces npm advisories in the step summary
      # but does not block the PR. Bun 1.3.x exits 0 even when vulnerabilities
      # are present, so we don't gate on the exit code today; promotion to
      # required happens via a follow-up once we tune --audit-level + parse
      # the JSON output for actual findings.
      #
      # We capture the exit code explicitly so a *tool* failure (segfault,
      # missing arg, network) is distinguishable from a clean run with
      # findings — the `|| true` pattern would have masked both.
      - name: bun audit (advisory)
        if: always()
        run: |
          set +e
          bun audit --audit-level=moderate > /tmp/audit.txt 2>&1
          code=$?
          set -e
          {
            echo "## bun audit (advisory, exit=$code)"
            echo ""
            echo '```'
            cat /tmp/audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::warning::bun audit exited with unexpected code $code (advisory step; not failing the job)"
          fi

      - name: Generate bun audit JSON
        if: always()
        id: audit-json
        run: |
          set +e
          bun audit --audit-level=low --json > audit.json 2>/tmp/audit-err.txt
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::warning::bun audit --json exited with unexpected code $code"
            cat /tmp/audit-err.txt || true
          fi
      - name: Upload bun audit JSON
        if: always() && steps.audit-json.outputs.exit != ''
        uses: actions/upload-artifact@v7
        with:
          name: bun-audit
          path: audit.json
          if-no-files-found: ignore
