name: store-check
run-name: "store-check → ${{ inputs.store }}"

# Proves a store credential works, read-only: no upload, no release, no deploy hook. Kept out of
# release.yml on purpose — a non-dry dispatch there re-uploads release assets, rewrites the notes
# and fires the deploy hooks, none of which a credential check may touch.
#
# Each job runs in its store's environment with that store's permissions and auth steps exactly as
# release.yml's publish job does, and runs the same script with MODE=check. Every step of a job that
# holds `id-token: write` is trusted code: checkout, Bun, Google's auth action, the repo's script.
#
# `gh workflow run store-check.yml --ref main -f store=chrome`

on:
  workflow_dispatch:
    inputs:
      store:
        description: "Which store's credential to check"
        type: choice
        default: chrome
        options:
          - chrome

permissions:
  contents: read

concurrency:
  group: store-check
  cancel-in-progress: false

jobs:
  chrome:
    name: check Chrome Web Store access
    if: inputs.store == 'chrome'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Authenticate to Google (OIDC → WIF)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: fetchStatus
        env:
          MODE: check
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: bun scripts/release/publish-chrome-store-run.ts
