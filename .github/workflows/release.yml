name: release

# Two trigger paths:
#  - push to main: release-please-action maintains the Release PR; on merge,
#    it tags + creates the GitHub Release. The same workflow run then runs
#    the publish chain (gates → build → smoke → assets → cliff notes →
#    landing). The store uploads are opt-in workflow_dispatch inputs.
#  - workflow_dispatch: re-publish artifacts for an existing tag. Skips the
#    release-please job. Useful when an asset upload failed mid-publish.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Re-publish artifacts for an existing tag (e.g. v0.20.0). Skips release-please."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Skip the actual gh release upload + body update + Cloudflare hook. Build + gates still run."
        required: false
        type: boolean
        default: false
      run_network_e2e:
        description: "Run network e2e gate (~30-45 min). Off by default on workflow_dispatch; opt in for paranoid republishes. Stable push:main always runs it (this input is only consulted on workflow_dispatch)."
        required: false
        type: boolean
        default: false
      publish_chrome:
        description: "Upload the Chrome zip to the Chrome Web Store (keyless: OIDC → Google WIF; environment chrome-web-store). Stable tags on main only."
        required: false
        type: boolean
        default: false
      publish_firefox:
        description: "Upload the Firefox zip to Firefox Add-ons (environment firefox-add-ons). Stable tags on main only."
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

# Least-privilege default: read-only for every job (covers checkout; artifact +
# cache ops don't need a `permissions:` scope). The handful of jobs that write
# (release-please, auto-unstick, attach-assets, sync) escalate explicitly in
# their own block — so build/test/resolve/deploy/verify/status no longer inherit
# a write-capable token (codex post-impl audit, Should-fix 3).
permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Uses the App token for its writes (signing + CI cascade), but escalate the
    # job token too so the action is robust if it ever falls back to GITHUB_TOKEN.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # App-authenticated token: ensures (a) the Release PR's commits are
      # bot-verified (satisfies main's "signed commits required" rule), and
      # (b) the PR's pull_request event triggers normal CI (GITHUB_TOKEN
      # would suppress downstream workflow runs).
      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          # Explicit target. Without this release-please-action defaults to
          # the repo's default branch (`dev`), which would open Release PRs
          # against dev with a malformed title (component+version both miss).
          target-branch: main
          token: ${{ steps.app.outputs.token }}

  # release-please-action@v4 abort bug: after a Release PR merges, the action logs
  # "untagged, merged release PRs outstanding" and never tags, so release_created
  # stays false and the whole publish chain below skips (the documented manual
  # unstick exists for exactly this). This job detects that precise state — a
  # MERGED `autorelease: pending` Release PR whose merge commit IS github.sha (an
  # explicit PR-to-SHA check, never a title heuristic) — creates the tag + empty
  # release itself, and feeds `resolve` so the chain continues. All logic + guards
  # live in unit-tested scripts/release/auto-unstick*.ts. Behind
  # vars.AUTO_UNSTICK_ENABLED (unset/anything-but-on ⇒ OFF — staged rollout; the
  # manual unstick stays the documented fallback until the flag is flipped). When
  # OFF the job still runs but the script no-ops (unstuck=false) → resolve stays
  # skipped → today's behavior exactly, so the first flag-off release validates
  # this wiring before anyone flips it on.
  auto-unstick:
    needs: release-please
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write # covers PR labels + comments (autorelease:* / needs-manual-resolution)
    outputs:
      unstuck: ${{ steps.u.outputs.unstuck }}
      tag_name: ${{ steps.u.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-bun
      - id: u
        env:
          AUTO_UNSTICK_ENABLED: ${{ vars.AUTO_UNSTICK_ENABLED }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/release/auto-unstick-run.ts

  # Translate either trigger path into the same {tag, version, sha, is_prerelease}
  # outputs that downstream jobs consume. Runs on every workflow_dispatch (the
  # script fails loudly on empty tag) and only when release-please created a
  # release on the push path.
  resolve:
    needs: [release-please, auto-unstick]
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true'
        || needs.auto-unstick.outputs.unstuck == 'true'
        || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      sha: ${{ steps.r.outputs.sha }}
      is_prerelease: ${{ steps.r.outputs.is_prerelease }}
      # The dispatch ref authenticates the WORKFLOW FILE, not the tag it checks out: without this
      # output a tag on any branch could supply the script that runs with a store credential.
      on_main: ${{ steps.r.outputs.on_main }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: r
        env:
          TAG_FROM_PLEASE: ${{ needs.release-please.outputs.tag_name }}
          TAG_FROM_UNSTICK: ${{ needs.auto-unstick.outputs.tag_name }}
          TAG_FROM_INPUT: ${{ github.event.inputs.tag }}
          IS_PUSH: ${{ github.event_name == 'push' }}
        run: |
          if [ "$IS_PUSH" = "true" ]; then
            # release-please's tag on the happy path; the auto-unstick's tag on the abort path.
            TAG="${TAG_FROM_PLEASE:-$TAG_FROM_UNSTICK}"
          else
            TAG="$TAG_FROM_INPUT"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved — workflow_dispatch requires the 'tag' input (e.g. v0.20.0), and push events need release-please to have created a release."
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG not found in repo (fetch-tags should have brought it; was the release-please commit pushed?)"
            exit 1
          fi
          SHA=$(git rev-list -n 1 "$TAG")
          VERSION="${TAG#v}"
          IS_PRE="false"
          case "$VERSION" in *-*) IS_PRE="true" ;; esac
          # true/false, never an abort: resolve also serves releases that publish to no store.
          ON_MAIN="false"
          if git merge-base --is-ancestor "$SHA" origin/main; then ON_MAIN="true"; fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "is_prerelease=$IS_PRE"
            echo "on_main=$ON_MAIN"
          } >> "$GITHUB_OUTPUT"
          # Written before any protected job asks for approval, so the approver sees what would ship.
          {
            echo "## resolve"
            echo "- tag: \`$TAG\`"
            echo "- sha: \`$SHA\`"
            echo "- prerelease: $IS_PRE"
            echo "- on main: $ON_MAIN"
          } >> "$GITHUB_STEP_SUMMARY"

  # A skipped ancestor anywhere in the needs chain (release-please on workflow_dispatch) skips
  # every descendant unless its `if` starts with `always()`; each result is then checked by hand.
  lint-and-typecheck:
    needs: resolve
    if: always() && needs.resolve.result == 'success'
    uses: ./.github/workflows/_lint-and-typecheck.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  unit-tests:
    needs: resolve
    if: always() && needs.resolve.result == 'success'
    uses: ./.github/workflows/_unit-tests.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  network-e2e:
    needs: resolve
    # Network-e2e firing rule: OPT-IN ONLY (workflow_dispatch with
    # `run_network_e2e=true`). It no longer runs on the auto push:main publish —
    # the promote dev→main PR already gates the exact code with the full network
    # suite before it reaches main, so re-running the flaky 30-45 min suite on the
    # publish only duplicated that gate AND could strand a release: a network-e2e
    # cancellation/timeout on push:main took the whole run down mid-attach (leaving
    # a tag + empty release). Dropped the `push` trigger 2026-07-20. The publish
    # still gates on smoke-against-artifact (real built zip). Pass run_network_e2e=true
    # on a manual republish if you want the extra network pass.
    if: |
      always() &&
      needs.resolve.result == 'success' &&
      github.event.inputs.run_network_e2e == 'true'
    uses: ./.github/workflows/_extension-network-e2e.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    secrets:
      SPONSORED_FPC_SALT: ${{ secrets.SPONSORED_FPC_SALT }}

  build-chrome:
    needs: [resolve, lint-and-typecheck, unit-tests]
    if: always() && needs.resolve.result == 'success' && needs.lint-and-typecheck.result == 'success' && needs.unit-tests.result == 'success'
    uses: ./.github/workflows/_build-extension.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      target: chrome
      version_override: ${{ needs.resolve.outputs.version }}
      upload_artifacts: true

  build-firefox:
    needs: [resolve, lint-and-typecheck, unit-tests]
    if: always() && needs.resolve.result == 'success' && needs.lint-and-typecheck.result == 'success' && needs.unit-tests.result == 'success'
    uses: ./.github/workflows/_build-extension.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      target: firefox
      version_override: ${{ needs.resolve.outputs.version }}
      upload_artifacts: true

  smoke-against-artifact:
    needs: [resolve, build-chrome]
    if: always() && needs.resolve.result == 'success' && needs.build-chrome.result == 'success'
    uses: ./.github/workflows/_extension-smoke-e2e.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      artifact_name: extension-chrome

  # ADVISORY: the shipped Firefox zip's contents, smoked on Firefox. Deliberately absent from
  # attach-assets' and status's needs — a red run is visible and cannot fail this publish. It
  # does hold the `release` concurrency slot until it ends (20-minute timeout, plus any time
  # queued for a runner). It joins
  # attach-assets.needs after one clean release (CLAUDE.md, "Staged-rollout switches").
  smoke-firefox-against-artifact:
    needs: [resolve, build-firefox]
    if: always() && needs.resolve.result == 'success' && needs.build-firefox.result == 'success'
    uses: ./.github/workflows/_extension-smoke-e2e.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      artifact_name: extension-firefox
      browser: firefox

  attach-assets:
    needs: [resolve, lint-and-typecheck, unit-tests, network-e2e, build-chrome, build-firefox, smoke-against-artifact]
    # Skipped needs (e.g. network-e2e on prerelease or manual run_network_e2e=false)
    # would skip this job by default. The explicit guards let the job proceed when
    # a need was skipped but fail-fast if any need failed or was cancelled.
    if: |
      always() &&
      needs.resolve.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun

      - name: Download Chrome build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-chrome
          path: dist/release/chrome
      - name: Download Firefox build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-firefox
          path: dist/release/firefox

      # Every entry is stamped with the commit's own time and written in a fixed order, so a
      # rebuild of the same commit with the same zip gives the same bytes and a republish leaves
      # SHASUMS256.txt as it was (the runner image is not pinned: a zip update could still move
      # them once). The script is taken from the workflow's own revision, not the checkout: a tag
      # older than the script has none at its commit, and a republish must still package it.
      - name: Zip artifacts + SHASUMS
        run: |
          mkdir -p dist/release
          git show "${GITHUB_SHA}:scripts/release/zip-reproducible.ts" > "${RUNNER_TEMP}/zip-reproducible.ts"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          bun "${RUNNER_TEMP}/zip-reproducible.ts" dist/release/chrome "dist/release/nulo-chrome-${VERSION}.zip"
          bun "${RUNNER_TEMP}/zip-reproducible.ts" dist/release/firefox "dist/release/nulo-firefox-${VERSION}.zip"
          cd dist/release
          sha256sum \
            "nulo-chrome-${VERSION}.zip" \
            "nulo-firefox-${VERSION}.zip" \
            > SHASUMS256.txt

      - name: Upload zipped artifacts (for inspection)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.VERSION }}
          path: |
            dist/release/nulo-chrome-${{ env.VERSION }}.zip
            dist/release/nulo-firefox-${{ env.VERSION }}.zip
            dist/release/SHASUMS256.txt
          retention-days: 14

      # The tag already exists when this job runs (release-please or auto-unstick
      # creates it before the chain starts; a dispatch names an existing one), so
      # `--unreleased` finds nothing after it and left every body empty. The range
      # is chosen here by ancestry instead: a stable covers everything since the
      # previous stable, an rc everything since the previous rc or stable —
      # `git describe` takes the nearest such tag reachable from the release
      # commit's parent, so the nightly tags dev publishes daily (nightly.yml)
      # and git-cliff's own timestamp ordering never decide the boundary.
      - name: Pick the release-notes range
        env:
          IS_PRERELEASE: ${{ needs.resolve.outputs.is_prerelease }}
        run: |
          # The tag name reaches git-cliff's arguments through a shell, so only the two forms
          # release-please cuts here are accepted; the range itself is passed as commit ids.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc(\.[0-9]+)?)?$ ]] \
            || { echo "::error::release notes: tag ${TAG} is not a stable or rc tag"; exit 1; }
          exclude=(--exclude 'v*-nightly*' --exclude 'v*-internal*')
          [ "$IS_PRERELEASE" = "true" ] || exclude+=(--exclude 'v*-rc*')
          # Without any predecessor (a first release) the range starts after the root commit,
          # which holds no extension file.
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${exclude[@]}" "${TAG}^" 2>/dev/null) \
            || prev=$(git rev-list --max-parents=0 "$TAG" | tail -n 1)
          {
            echo "CLIFF_RANGE=$(git rev-parse "${prev}^{commit}")..$(git rev-parse "${TAG}^{commit}")"
            # Only this tag exists for git-cliff, so no tag inside the range can split the notes.
            echo "CLIFF_TAG_PATTERN=^${TAG//./\\.}\$"
          } >> "$GITHUB_ENV"
          echo "release notes cover ${prev}..${TAG}"

      - name: Generate release notes (git-cliff)
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: cliff.toml
          # --offline: naming the remote (GITHUB_REPO below) would otherwise make
          # git-cliff fetch commit metadata from the GitHub API, which the template
          # never uses.
          args: >-
            --tag ${{ env.TAG }}
            --tag-pattern '${{ env.CLIFF_TAG_PATTERN }}'
            --strip header
            --offline
            --include-path 'apps/extension/**'
            ${{ env.CLIFF_RANGE }}
        env:
          OUTPUT: /tmp/release-notes.md
          # The template links each commit through remote.github, which git-cliff
          # reads from the checked-out branch's upstream; a detached checkout has
          # none, so every link came out empty until the remote was named here.
          GITHUB_REPO: ${{ github.repository }}

      - name: Show generated notes
        run: |
          echo '--- release notes preview ---'
          cat /tmp/release-notes.md || true

      - name: Upload assets + overwrite body with git-cliff notes
        if: env.DRY_RUN != 'true'
        run: |
          gh release upload "$TAG" \
            "dist/release/nulo-chrome-${VERSION}.zip" \
            "dist/release/nulo-firefox-${VERSION}.zip" \
            "dist/release/SHASUMS256.txt" \
            --clobber
          gh release edit "$TAG" --notes-file /tmp/release-notes.md

      - name: Dry-run preview (skip publish)
        if: env.DRY_RUN == 'true'
        run: |
          echo "DRY RUN — would have uploaded these assets to $TAG:"
          ls -la dist/release/
          echo ""
          echo "DRY RUN — would have set release body to:"
          cat /tmp/release-notes.md

  refresh-landing:
    name: refresh landing (deploy hook)
    needs: [resolve, attach-assets]
    if: |
      always() && !cancelled() &&
      needs.resolve.result == 'success' &&
      needs.attach-assets.result == 'success' &&
      needs.resolve.outputs.is_prerelease == 'false' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    steps:
      - name: Trigger landing deploy
        env:
          LANDING_HOOK: ${{ secrets.CLOUDFLARE_LANDING_DEPLOY_HOOK }}
          PAGES_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          # The Workers hook once it is set; Pages, which still serves nulo.sh, until then.
          if [ -n "$LANDING_HOOK" ]; then
            case "$LANDING_HOOK" in
              https://api.cloudflare.com/client/v4/workers/builds/deploy_hooks/*) ;;
              *)
                echo "::error::CLOUDFLARE_LANDING_DEPLOY_HOOK is not a Workers Builds deploy hook URL"
                exit 1
                ;;
            esac
            DEPLOY_HOOK="$LANDING_HOOK"
          elif [ -n "$PAGES_HOOK" ]; then
            DEPLOY_HOOK="$PAGES_HOOK"
          else
            echo "::error::neither CLOUDFLARE_LANDING_DEPLOY_HOOK nor CLOUDFLARE_PAGES_DEPLOY_HOOK is set"
            exit 1
          fi
          code=$(curl -sS -o /tmp/cf.out -w "%{http_code}" \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST "$DEPLOY_HOOK")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::deploy-hook curl returned HTTP $code"
            cat /tmp/cf.out
            exit 1
          fi
          # A Workers Builds hook names the Worker and branch it queued (a build already queued answers
          # without them), so a valid hook for another Worker or branch cannot pass as a landing refresh.
          if [ -n "$LANDING_HOOK" ] && ! jq -e '.success == true
              and (.result.worker // "nulo-landing") == "nulo-landing"
              and (.result.branch // "main") == "main"' /tmp/cf.out > /dev/null; then
            echo "::error::the landing deploy hook did not queue a build of nulo-landing on main"
            cat /tmp/cf.out
            exit 1
          fi
          echo "deploy-hook triggered (HTTP $code)"

  verify-live:
    name: verify live deploys (advisory)
    needs: [resolve, attach-assets, refresh-landing]
    # ADVISORY — deliberately NOT in the `status` aggregator. It reports red
    # without blocking the release; open nulo.sh and re-fire the deploy
    # (refresh-landing.yml break-glass) if it flags a stale site.
    if: |
      always() &&
      needs.resolve.outputs.is_prerelease == 'false' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.event.inputs.dry_run != 'true' &&
      needs.attach-assets.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The workflow's own revision, not the tag: a republished old tag must not run that tag's
      # verifier, which may probe sites this repo no longer deploys.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: Verify the live landing serves this release
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bun scripts/release/verify-live-run.ts

  sync-main-to-dev:
    name: sync main → dev (post-release)
    needs: [resolve, attach-assets]
    # ADVISORY (deliberately NOT in the `status` aggregator): this runs AFTER the
    # release is published, so a sync hiccup must never retro-fail a shipped
    # release — a CONFLICTING/UNKNOWN sync is surfaced as a labeled PR, an IO
    # error reds this job alone. Push-only: a workflow_dispatch republish of an
    # old tag must never re-sync (codex Critical-1); the runner's syncEligible
    # re-checks `github.sha == the Release-PR merge commit` as defense in depth.
    # All logic lives in the unit-tested scripts/release/open-sync-pr*.ts.
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.resolve.outputs.is_prerelease == 'false' &&
      needs.attach-assets.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write # covers PR labels + comments (autorelease:* / needs-manual-resolution)
    steps:
      # App token so the sync PR is bot-opened → dev's required CI fires
      # (a GITHUB_TOKEN-opened PR suppresses the pull_request workflow), and the
      # branch + the manifest-rebaseline commit are App-authenticated. The sync PR is
      # MERGE-committed (not squashed) so main's release commit stays in dev's ancestry
      # — the prerelease version-anchor needs it (a squash drops it and re-breaks the rc
      # cut; see implementations-plan/release-prerelease-fix/). A merge (unlike a squash)
      # brings the branch's own manifest-rebaseline commit onto dev; open-sync-pr-run.ts
      # writes that commit via the Contents API under THIS App token, which GitHub SIGNS
      # (verified), so classic required_signatures is satisfied and the merge needs NO
      # `--admin`. (The `--admin` fallback only matters if that signing ever regresses.)
      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: ./.github/actions/setup-bun
      - name: Open the main→dev sync PR
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_PRERELEASE: ${{ needs.resolve.outputs.is_prerelease }}
          HEAD_SHA: ${{ github.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bun scripts/release/open-sync-pr-run.ts

  # Keyless: the job's OIDC token is exchanged through Google Workload Identity Federation for a
  # ten-minute access token on the service account linked to the store publisher. The environment
  # holds ids as VARIABLES and no secret; its protection rules (main only, required reviewer) and
  # the pool's attribute condition (repository id, environment, ref, event, workflow_ref) are what
  # bound this job. store-check.yml exercises the same credential read-only.
  publish-chrome-store:
    name: publish to Chrome Web Store (${{ needs.resolve.outputs.tag }})
    needs: [resolve, attach-assets]
    if: |
      always() && !cancelled() &&
      github.event.inputs.publish_chrome == 'true' &&
      needs.resolve.result == 'success' &&
      needs.attach-assets.result == 'success' &&
      needs.resolve.outputs.is_prerelease == 'false' &&
      needs.resolve.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      # A tag older than this job has no publish script at its commit and fails here, clearly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
      # No workspace install: the script imports only node: modules and Bun built-ins.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.resolve.outputs.version }}
          path: dist/release
      # Exactly one SHASUMS line may name this zip; `--ignore-missing` would pass on the other store's line alone.
      - name: Verify the Chrome zip checksum
        working-directory: dist/release
        run: |
          line=$(grep -E " nulo-chrome-${VERSION}\.zip$" SHASUMS256.txt)
          [ "$(printf '%s\n' "$line" | wc -l)" = "1" ] || { echo "::error::expected one SHASUMS line for nulo-chrome-${VERSION}.zip"; exit 1; }
          printf '%s\n' "$line" | sha256sum -c -
      - name: Authenticate to Google (OIDC → WIF)
        if: env.DRY_RUN != 'true'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload and publish
        env:
          MODE: publish
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          CWS_PUBLISH_TYPE: ${{ vars.CWS_PUBLISH_TYPE }}
          ZIP_PATH: dist/release/nulo-chrome-${{ needs.resolve.outputs.version }}.zip
        run: bun scripts/release/publish-chrome-store-run.ts

  # Firefox Add-ons: same gate, one stored key pair. The `firefox-add-ons` environment holds
  # AMO_JWT_ISSUER + AMO_JWT_SECRET; they reach exactly one step, after every third-party action
  # has run. The source package Mozilla's reviewers rebuild is `git archive` of the release commit,
  # so it can never contain a credential. store-check.yml exercises the same key pair read-only.
  publish-firefox-amo:
    name: publish to Firefox Add-ons (${{ needs.resolve.outputs.tag }})
    needs: [resolve, attach-assets]
    if: |
      always() && !cancelled() &&
      github.event.inputs.publish_firefox == 'true' &&
      needs.resolve.result == 'success' &&
      needs.attach-assets.result == 'success' &&
      needs.resolve.outputs.is_prerelease == 'false' &&
      needs.resolve.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firefox-add-ons
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      # A tag older than this job has no publish script at its commit and fails here, clearly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
      # No workspace install: the script imports only node: modules and Bun built-ins.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.resolve.outputs.version }}
          path: dist/release
      # Exactly one SHASUMS line may name this zip; `--ignore-missing` would pass on the other store's line alone.
      - name: Verify the Firefox zip checksum
        working-directory: dist/release
        run: |
          line=$(grep -E " nulo-firefox-${VERSION}\.zip$" SHASUMS256.txt)
          [ "$(printf '%s\n' "$line" | wc -l)" = "1" ] || { echo "::error::expected one SHASUMS line for nulo-firefox-${VERSION}.zip"; exit 1; }
          printf '%s\n' "$line" | sha256sum -c -
      # The reviewer's source package: the release commit, prefixed like a tarball, nothing untracked.
      - name: Package the source archive
        run: |
          mkdir -p dist/source
          git archive --format=zip --prefix="nulo-${VERSION}/" -o "dist/source/nulo-${VERSION}-source.zip" HEAD
          ls -l "dist/source/nulo-${VERSION}-source.zip"
      - name: Upload, create the version and attach the source
        env:
          MODE: publish
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          ZIP_PATH: dist/release/nulo-firefox-${{ needs.resolve.outputs.version }}.zip
          SOURCE_PATH: dist/source/nulo-${{ needs.resolve.outputs.version }}-source.zip
          LISTING_PATH: apps/extension/store/listing.md
        run: bun scripts/release/publish-firefox-amo-run.ts

  status:
    name: status
    if: always()
    needs:
      [
        release-please,
        auto-unstick,
        resolve,
        lint-and-typecheck,
        unit-tests,
        network-e2e,
        build-chrome,
        build-firefox,
        smoke-against-artifact,
        attach-assets,
        refresh-landing,
        publish-chrome-store,
        publish-firefox-amo,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate results
        run: |
          for r in \
            "${{ needs.release-please.result }}" \
            "${{ needs.auto-unstick.result }}" \
            "${{ needs.resolve.result }}" \
            "${{ needs.lint-and-typecheck.result }}" \
            "${{ needs.unit-tests.result }}" \
            "${{ needs.network-e2e.result }}" \
            "${{ needs.build-chrome.result }}" \
            "${{ needs.build-firefox.result }}" \
            "${{ needs.smoke-against-artifact.result }}" \
            "${{ needs.attach-assets.result }}" \
            "${{ needs.refresh-landing.result }}" \
            "${{ needs.publish-chrome-store.result }}" \
            "${{ needs.publish-firefox-amo.result }}" \
          ; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A release stage failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "Release pipeline completed."
