name: release

# Two trigger paths:
#  - push to main: release-please-action maintains the Release PR; on merge,
#    it tags + creates the GitHub Release. The same workflow run then runs
#    the publish chain (gates → build → smoke → assets → cliff notes →
#    landing → marketplaces).
#  - workflow_dispatch: re-publish artifacts for an existing tag. Skips the
#    release-please job. Useful when an asset upload failed mid-publish.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Re-publish artifacts for an existing tag (e.g. v0.20.0). Skips release-please."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Skip the actual gh release upload + body update + Cloudflare hook. Build + gates still run."
        required: false
        type: boolean
        default: false
      run_network_e2e:
        description: "Run network e2e gate (~30-45 min). Disable only for emergency re-publish."
        required: false
        type: boolean
        default: true
      publish_marketplaces:
        description: "Enable Chrome Web Store + Firefox AMO publishing (stubs until secrets are wired)."
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # App-authenticated token: ensures (a) the Release PR's commits are
      # bot-verified (satisfies main's "signed commits required" rule), and
      # (b) the PR's pull_request event triggers normal CI (GITHUB_TOKEN
      # would suppress downstream workflow runs).
      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app.outputs.token }}

  # Translate either trigger path into the same {tag, version, sha, is_prerelease}
  # outputs that downstream jobs consume. Runs on every workflow_dispatch (the
  # script fails loudly on empty tag) and only when release-please created a
  # release on the push path.
  resolve:
    needs: release-please
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      sha: ${{ steps.r.outputs.sha }}
      is_prerelease: ${{ steps.r.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: r
        env:
          TAG_FROM_PLEASE: ${{ needs.release-please.outputs.tag_name }}
          TAG_FROM_INPUT: ${{ github.event.inputs.tag }}
          IS_PUSH: ${{ github.event_name == 'push' }}
        run: |
          if [ "$IS_PUSH" = "true" ]; then
            TAG="$TAG_FROM_PLEASE"
          else
            TAG="$TAG_FROM_INPUT"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved — workflow_dispatch requires the 'tag' input (e.g. v0.20.0), and push events need release-please to have created a release."
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG not found in repo (fetch-tags should have brought it; was the release-please commit pushed?)"
            exit 1
          fi
          SHA=$(git rev-list -n 1 "$TAG")
          VERSION="${TAG#v}"
          IS_PRE="false"
          case "$VERSION" in *-*) IS_PRE="true" ;; esac
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "is_prerelease=$IS_PRE"
          } >> "$GITHUB_OUTPUT"

  lint-and-typecheck:
    needs: resolve
    uses: ./.github/workflows/_lint-and-typecheck.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  unit-tests:
    needs: resolve
    uses: ./.github/workflows/_unit-tests.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  network-e2e:
    needs: resolve
    if: |
      needs.resolve.outputs.is_prerelease == 'false' &&
      (github.event_name == 'push' || github.event.inputs.run_network_e2e == 'true')
    uses: ./.github/workflows/_network-e2e.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    secrets:
      SPONSORED_FPC_SALT: ${{ secrets.SPONSORED_FPC_SALT }}

  build-chrome:
    needs: [resolve, lint-and-typecheck, unit-tests]
    uses: ./.github/workflows/_build-extension.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      target: chrome
      version_override: ${{ needs.resolve.outputs.version }}
      upload_artifacts: true

  build-firefox:
    needs: [resolve, lint-and-typecheck, unit-tests]
    uses: ./.github/workflows/_build-extension.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      target: firefox
      version_override: ${{ needs.resolve.outputs.version }}
      upload_artifacts: true

  smoke-against-artifact:
    needs: [resolve, build-chrome]
    uses: ./.github/workflows/_smoke-e2e.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      artifact_name: extension-chrome

  attach-assets:
    needs: [resolve, build-chrome, build-firefox, smoke-against-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun

      - name: Download Chrome build
        uses: actions/download-artifact@v8
        with:
          name: extension-chrome
          path: dist/release/chrome
      - name: Download Firefox build
        uses: actions/download-artifact@v8
        with:
          name: extension-firefox
          path: dist/release/firefox

      - name: Zip artifacts + SHASUMS
        run: |
          mkdir -p dist/release
          (cd dist/release/chrome && zip -r "../nulo-chrome-${VERSION}.zip" .)
          (cd dist/release/firefox && zip -r "../nulo-firefox-${VERSION}.zip" .)
          cd dist/release
          sha256sum \
            "nulo-chrome-${VERSION}.zip" \
            "nulo-firefox-${VERSION}.zip" \
            > SHASUMS256.txt

      - name: Upload zipped artifacts (for inspection)
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.VERSION }}
          path: |
            dist/release/nulo-chrome-${{ env.VERSION }}.zip
            dist/release/nulo-firefox-${{ env.VERSION }}.zip
            dist/release/SHASUMS256.txt
          retention-days: 14

      - name: Generate release notes (git-cliff)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ env.TAG }} --unreleased --strip header --include-path 'packages/extension/**'
        env:
          OUTPUT: /tmp/release-notes.md

      - name: Show generated notes
        run: |
          echo '--- release notes preview ---'
          cat /tmp/release-notes.md || true

      - name: Upload assets + overwrite body with git-cliff notes
        if: env.DRY_RUN != 'true'
        run: |
          gh release upload "$TAG" \
            "dist/release/nulo-chrome-${VERSION}.zip" \
            "dist/release/nulo-firefox-${VERSION}.zip" \
            "dist/release/SHASUMS256.txt" \
            --clobber
          gh release edit "$TAG" --notes-file /tmp/release-notes.md

      - name: Dry-run preview (skip publish)
        if: env.DRY_RUN == 'true'
        run: |
          echo "DRY RUN — would have uploaded these assets to $TAG:"
          ls -la dist/release/
          echo ""
          echo "DRY RUN — would have set release body to:"
          cat /tmp/release-notes.md

  refresh-landing:
    name: refresh landing (Cloudflare Pages deploy hook)
    needs: [resolve, attach-assets]
    if: |
      needs.resolve.outputs.is_prerelease == 'false' &&
      github.event_name == 'push' &&
      github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    steps:
      - name: Trigger Cloudflare Pages deploy
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::CLOUDFLARE_PAGES_DEPLOY_HOOK secret is not set"
            exit 1
          fi
          code=$(curl -sS -o /tmp/cf.out -w "%{http_code}" \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST "$DEPLOY_HOOK")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::deploy-hook curl returned HTTP $code"
            cat /tmp/cf.out
            exit 1
          fi
          echo "deploy-hook triggered (HTTP $code)"

  publish-chrome-store:
    name: publish to Chrome Web Store
    needs: [resolve, attach-assets]
    if: github.event.inputs.publish_marketplaces == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.resolve.outputs.version }}
          path: dist/release
      # Requires repo secrets: CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN, CWS_EXTENSION_ID
      - name: Upload to Chrome Web Store
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          echo "Stub. Wire chrome-webstore-upload-cli or mnao305/chrome-extension-upload here."
          exit 1  # Until secrets are wired, fail loudly when this is accidentally enabled.

  publish-firefox-amo:
    name: publish to Firefox AMO
    needs: [resolve, attach-assets]
    if: github.event.inputs.publish_marketplaces == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.resolve.outputs.version }}
          path: dist/release
      # Requires repo secrets: AMO_JWT_ISSUER, AMO_JWT_SECRET
      # Requires `gecko.id` in packages/extension/manifest/manifest.firefox.config.ts to be a real ID.
      - name: Upload to AMO
        env:
          IS_PRERELEASE: ${{ needs.resolve.outputs.is_prerelease }}
        run: |
          echo "Stub. Wire web-ext sign here."
          exit 1  # Until secrets are wired, fail loudly when this is accidentally enabled.

  status:
    name: status
    if: always()
    needs:
      [
        release-please,
        resolve,
        lint-and-typecheck,
        unit-tests,
        network-e2e,
        build-chrome,
        build-firefox,
        smoke-against-artifact,
        attach-assets,
        refresh-landing,
        publish-chrome-store,
        publish-firefox-amo,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate results
        run: |
          for r in \
            "${{ needs.release-please.result }}" \
            "${{ needs.resolve.result }}" \
            "${{ needs.lint-and-typecheck.result }}" \
            "${{ needs.unit-tests.result }}" \
            "${{ needs.network-e2e.result }}" \
            "${{ needs.build-chrome.result }}" \
            "${{ needs.build-firefox.result }}" \
            "${{ needs.smoke-against-artifact.result }}" \
            "${{ needs.attach-assets.result }}" \
            "${{ needs.refresh-landing.result }}" \
            "${{ needs.publish-chrome-store.result }}" \
            "${{ needs.publish-firefox-amo.result }}" \
          ; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A release stage failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "Release pipeline completed."
