name: Contracts

# PR gate for contracts/bridge/**. Follows the repo's per-package convention: a `changes`
# job with dorny/paths-filter, real jobs gated on it, and a bare-named status aggregator
# that emits pass when the suites are skipped.
#
# NO `branches:` filter, deliberately — see the long note in pr-quick.yml. That key filters
# on the PR's BASE, so a stacked arc targeting its parent branch would get zero CI.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      contracts: ${{ steps.override.outputs.full || steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v6

      - id: override
        name: workflow_dispatch bypasses the filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # Positive-only, no `!` negations — the dorny `some`-quantifier footgun.
          # gen-remappings is included because the forge project cannot resolve without it.
          filters: |
            contracts:
              - 'contracts/bridge/**'
              - 'packages/bridge-core/scripts/gen-remappings.ts'
              - '.github/workflows/contracts.yml'
              - '.github/workflows/_bridge-contracts.yml'

  suites:
    name: Suites
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    uses: ./.github/workflows/_bridge-contracts.yml

  contracts-status:
    name: contracts-status
    if: always()
    needs: [changes, suites]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate results
        run: |
          for r in \
            "${{ needs.changes.result }}" \
            "${{ needs.suites.result }}" \
          ; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job failed or was cancelled: $r"
              exit 1
            fi
          done
