name: _Unit tests (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout.
        required: false
        type: string
        default: ""

jobs:
  unit-tests:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-bun

      - name: Run unit tests in every package
        run: bun run test:all
