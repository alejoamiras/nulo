name: Bridge contracts

# PR gate for the any-ERC-20 bridge: contracts/bridge/** (Foundry + Noir suites) and, once the
# integration job lands, packages/bridge-core's sandbox round trips. Follows the repo's
# per-package convention: a `changes` job with dorny/paths-filter, real jobs gated on it, and a
# bare-named status aggregator that emits pass when the suites are skipped.
#
# NO `branches:` filter, deliberately — see the long note in pr-quick.yml. That key filters
# on the PR's BASE, so a stacked arc targeting its parent branch would get zero CI.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: bridge-contracts-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      contracts: ${{ steps.override.outputs.full || steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: paths-filter needs the merge-base with the comparison branch; a
          # shallow clone falls back to a `fetch --deepen` loop that races on long branches.
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          # Positive-only, no `!` negations — the dorny `some`-quantifier footgun.
          # gen-remappings is included because the forge project cannot resolve without it.
          filters: |
            contracts:
              - 'contracts/bridge/**'
              - 'packages/bridge-core/scripts/gen-remappings.ts'
              - '.github/workflows/bridge-contracts.yml'
              - '.github/workflows/_bridge-contracts.yml'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "full=true" >> "$GITHUB_OUTPUT"

  suites:
    name: Suites
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    uses: ./.github/workflows/_bridge-contracts.yml

  status:
    name: bridge-contracts-status
    if: always()
    needs: [changes, suites]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate results
        run: |
          # Exact state machine (the shape the extension gates use): `changes` must succeed, and
          # `suites` must be `success` when the filter tripped and `skipped` when it did not.
          RUN="${{ needs.changes.outputs.contracts }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::Detect changes did not succeed: ${{ needs.changes.result }}"
            exit 1
          fi
          case "$RUN" in
            true) want="success" ;;
            false|"") want="skipped" ;;
            *) echo "::error::changes.outputs.contracts is not true/false: '$RUN'"; exit 1 ;;
          esac
          if [ "${{ needs.suites.result }}" != "$want" ]; then
            echo "::error::filter said contracts=$RUN, so the suites must be '$want' — got '${{ needs.suites.result }}'"
            exit 1
          fi
          echo "Bridge contracts gate passed (or was skipped — no relevant changes)."
