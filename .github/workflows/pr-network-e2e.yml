name: Network e2e

on:
  workflow_dispatch:
    inputs:
      disable_accelerator:
        description: "Skip accelerator-server for this manual run (investigation override)"
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main, dev]
    # `labeled` so adding `e2e:network` after open triggers a fresh run;
    # `unlabeled` so removing it re-evaluates the gate instead of leaving
    # a stale failing result.
    types: [opened, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: pr-network-e2e-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      extension-network: ${{ steps.override.outputs.full || steps.filter.outputs.extension-network }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          filters: |
            extension-network:
              - 'packages/extension/src/wallet/services/network/**'
              - 'packages/extension/src/wallet/services/execution/**'
              - 'packages/extension/src/wallet/services/fpc/**'
              - 'packages/extension/src/wallet/services/dapp-interaction/**'
              - 'packages/extension/src/wallet/services/dapp-session/**'
              # TokenBalance + token detail page — added 2026-05-24 so a
              # TokenBalance-only bugfix PR on `dev` doesn't silently skip the
              # network matrix. The Phase B TokenBalance auto-refresh change
              # lives in tokens/[id].vue + balance service code.
              - 'packages/extension/src/wallet/services/token-balance/**'
              - 'packages/extension/src/popup/pages/tokens/**'
              - 'packages/extension/src/offscreen/**'
              - 'packages/extension/tests/e2e/network/**'
              - 'packages/extension/tests/e2e/fixtures/**'
              - 'packages/extension/scripts/e2e/**'
              - 'packages/extension/vitest.e2e.network.config.ts'
              - 'packages/extension/vitest.e2e.all.config.ts'
              - 'packages/aztec-runtime/**'
              - 'packages/wallet-bridge/**'
              - 'packages/playground/**'
              - '.github/workflows/_network-e2e.yml'
              - '.github/workflows/pr-network-e2e.yml'
              - '.github/actions/setup-aztec/**'
              - '.github/actions/setup-accelerator-server/**'
              - '.github/actions/setup-bun/**'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'package.json'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "full=true" >> "$GITHUB_OUTPUT"

  decide:
    name: Decide
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          NETWORK: ${{ needs.changes.outputs.extension-network }}
          LABEL_HIT: ${{ contains(github.event.pull_request.labels.*.name, 'e2e:network') }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] \
             || [ "$BASE" = "main" ] \
             || [ "$LABEL_HIT" = "true" ] \
             || { [ "$BASE" = "dev" ] && [ "$NETWORK" = "true" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  network-e2e:
    name: Run / shard ${{ matrix.shard.id }}
    needs: decide
    if: needs.decide.outputs.run == 'true'
    strategy:
      # Don't cancel other shards when one fails — under flaky CI we want the
      # full per-shard picture. fail-fast: true would mask "is this 1 specific
      # shard failing or is the suite broadly broken?"
      fail-fast: false
      matrix:
        # N=5 splits the lightweight network test files into ~9-per-shard.
        # N=5 (not N=4) because vitest's deterministic SHA-1-of-file-path
        # sharder puts the two known slow files (multi-account-from,
        # tx-sendTx-multicall) into the same shard at N=4; N=5 separates
        # them. ~25% more runner cost for materially better worst-case
        # shard wall-time.
        #
        # Heavy-network tests run in the `network-e2e-heavy` job below — they
        # are EXCLUDED here so they don't pre-pressure the prover queue for
        # popup-shape tests on the same shard host. See codex audit session
        # 019e6743-2fb7-7df3-bad7-6cf503cf2338 ("Phase 4 deadlock").
        #
        # `id` is the vitest --shard=N/M value. `label` is the artifact-safe
        # variant (no `/`). actions/upload-artifact rejects `/` in artifact
        # names (https://github.com/actions/upload-artifact/issues/647), so
        # the reusable workflow takes both as separate inputs.
        shard:
          - { id: "1/5", label: "1-of-5" }
          - { id: "2/5", label: "2-of-5" }
          - { id: "3/5", label: "3-of-5" }
          - { id: "4/5", label: "4-of-5" }
          - { id: "5/5", label: "5-of-5" }
    uses: ./.github/workflows/_network-e2e.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      shard: ${{ matrix.shard.id }}
      shard_label: ${{ matrix.shard.label }}
      # Exclude heavy files from the SHA-1 distribution. Keep this list in
      # sync with `network-e2e-heavy` below.
      exclude_files: "tests/e2e/network/fee-methods.test.ts"
      # Two paths to disable accelerator (both need repo write access):
      #   - vars.NULO_E2E_DISABLE_ACCELERATOR=1 (Settings → Variables) for
      #     PR-triggered runs — the actual emergency kill switch
      #   - workflow_dispatch input for one-off manual reruns
      # PR authors cannot toggle either (vars require write access; dispatch
      # is gated by branch protection). See plan §10.
      disable_accelerator: ${{ github.event.inputs.disable_accelerator == 'true' || vars.NULO_E2E_DISABLE_ACCELERATOR == '1' }}
    secrets:
      SPONSORED_FPC_SALT: ${{ secrets.SPONSORED_FPC_SALT }}

  network-e2e-heavy:
    name: Run / heavy / fee-methods
    needs: decide
    if: needs.decide.outputs.run == 'true'
    # Dedicated runner so the prover queue isn't shared with popup-shape
    # tests. The file is ~6 min wall-time (5 tests, 4 real fee-juice TX
    # flows requiring full WASM proving on CI). Without this isolation the
    # fee-methods queue pressure caused the next file on the same shard to
    # exceed waitForPgResult budgets — Phase 4 was 1/5 at 5/5 green pre-split.
    uses: ./.github/workflows/_network-e2e.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      shard_label: "heavy"
      test_files: "tests/e2e/network/fee-methods.test.ts"
      disable_accelerator: ${{ github.event.inputs.disable_accelerator == 'true' || vars.NULO_E2E_DISABLE_ACCELERATOR == '1' }}
    secrets:
      SPONSORED_FPC_SALT: ${{ secrets.SPONSORED_FPC_SALT }}

  status:
    name: Status
    if: always()
    needs: [changes, decide, network-e2e, network-e2e-heavy]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate results
        run: |
          for r in \
            "${{ needs.changes.result }}" \
            "${{ needs.decide.result }}" \
            "${{ needs.network-e2e.result }}" \
            "${{ needs.network-e2e-heavy.result }}" \
          ; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "Network e2e gate passed (or was skipped — no relevant changes / not labeled)."
