name: _Build faucet (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout.
        required: false
        type: string
        default: ""
      upload_artifacts:
        description: Upload dist/ as a workflow artifact.
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: vite build (faucet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-bun

      # The faucet's deployments.json is generated by `bun run deploy:testnet`
      # and committed. This check fails CI if the committed JSON drifts from
      # what `getContractInstanceFromInstantiationParams` would derive from
      # the same constructor params + salts — the same drift that would
      # cause wallet.registerContract to reject every contract at connect
      # time. Cheap insurance against deploy/code skew.
      - name: Verify deployments.json matches the rebuild logic
        run: bun run --cwd packages/faucet verify:deployments

      - name: Smoke e2e (mock wallet, jsdom)
        run: bun run --cwd packages/faucet test:e2e

      - name: Build
        run: bun run --cwd packages/faucet build

      - name: Upload faucet build
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: faucet-dist
          path: packages/faucet/dist
          if-no-files-found: error
          retention-days: 7
