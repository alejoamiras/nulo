name: Setup Puppeteer
description: Restore ~/.cache/puppeteer so the bundled Chromium does not redownload on every run.

runs:
  using: composite
  steps:
    - uses: actions/cache@v5
      with:
        path: ~/.cache/puppeteer
        key: ${{ runner.os }}-puppeteer-${{ hashFiles('packages/extension/package.json') }}
        restore-keys: |
          ${{ runner.os }}-puppeteer-
