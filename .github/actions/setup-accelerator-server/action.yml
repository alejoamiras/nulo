name: Setup accelerator-server
description: |
  Install the headless aztec-accelerator server (Linux x86_64) for CI proving.
  Verifies the downloaded tarball against a repo-pinned SHA-256 — not the
  upstream sidecar, which a release-origin compromise would replace alongside
  the tarball. Caches by version+SHA so cache invalidation tracks any change
  in either input.

  Adds the binary to PATH at $RUNNER_TEMP/accelerator-bin. No sudo. No
  global filesystem mutation outside RUNNER_TEMP, which the runner reaps.

  Bumping: update `version` AND `expected_sha256` in the caller workflow,
  computed via `shasum -a 256` on a freshly downloaded tarball. See
  SECURITY.md "Binary dependencies" for the procedure.

inputs:
  version:
    description: |
      accelerator-server release tag suffix. The full tag is
      `accelerator-v${version}` and the asset is
      `accelerator-server-${version}-linux-x86_64.tar.gz`.
    required: false
    default: "1.0.1"
  expected_sha256:
    description: |
      Repo-pinned SHA-256 of the EXTRACTED accelerator-server binary
      (NOT the tarball — these are different hashes). The binary is the
      trust anchor because `actions/cache` restores the binary, not the
      tarball, so verifying the tarball on download wouldn't protect
      cache-hit runs. REQUIRED — not defaulted. Forcing the caller to
      pass it makes accidental version bumps fail loudly at the verify
      step. Compute via:
        curl -sSfL https://github.com/alejoamiras/aztec-accelerator/releases/download/accelerator-v<VER>/accelerator-server-<VER>-linux-x86_64.tar.gz \
          | tar -xzO accelerator-server | shasum -a 256
    required: true

runs:
  using: composite
  steps:
    - name: Compute install dir
      id: paths
      shell: bash
      run: |
        echo "bin_dir=$RUNNER_TEMP/accelerator-bin" >> "$GITHUB_OUTPUT"

    - name: Cache accelerator-server binary
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.paths.outputs.bin_dir }}
        key: ${{ runner.os }}-accelerator-server-${{ inputs.version }}-${{ inputs.expected_sha256 }}

    - name: Download + install (cache miss)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VER: ${{ inputs.version }}
        BIN_DIR: ${{ steps.paths.outputs.bin_dir }}
      run: |
        set -euo pipefail
        BASE="https://github.com/alejoamiras/aztec-accelerator/releases/download/accelerator-v${VER}"
        TARBALL="accelerator-server-${VER}-linux-x86_64.tar.gz"
        TMP=$(mktemp -d)
        cd "$TMP"
        curl -sSfL "${BASE}/${TARBALL}" -o "${TARBALL}"
        tar -xzf "${TARBALL}"
        mkdir -p "${BIN_DIR}"
        mv accelerator-server "${BIN_DIR}/accelerator-server"
        chmod +x "${BIN_DIR}/accelerator-server"

    # Verify SHA-256 on EVERY install — cache-miss AND cache-hit. (Codex
    # post-impl finding #2: skipping the check on cache hit weakens the
    # "repo-pinned SHA-256" defense to a one-time-only guarantee, leaving
    # the cache backend as an unverified trust point on every subsequent
    # run.) Hash the binary itself, not the tarball — at this point we
    # don't have the tarball on a cache hit.
    - name: Verify installed binary SHA-256
      shell: bash
      env:
        EXPECTED_SHA: ${{ inputs.expected_sha256 }}
        BIN_DIR: ${{ steps.paths.outputs.bin_dir }}
      run: |
        set -euo pipefail
        BINARY="${BIN_DIR}/accelerator-server"
        if [ ! -f "${BINARY}" ]; then
          echo "::error::accelerator-server binary missing at ${BINARY}"
          exit 1
        fi
        # Hash the binary as packaged inside the tarball (no extraction
        # mutations affect this — we move the file verbatim above and the
        # cache restores it byte-identical). Pre-compute the expected
        # binary hash with: `tar -xzf <tarball> -O accelerator-server | shasum -a 256`
        # OR pass the tarball SHA + reextract on every run. We keep the
        # tarball SHA in `expected_sha256` and re-derive the binary SHA
        # from it via a known-fixed extraction (tarball is 1 file).
        # Simpler: just re-hash the binary against a pre-computed
        # expected_binary_sha256. For now we re-fetch + recompute on
        # mismatch to give a clear error.
        ACTUAL=$(shasum -a 256 "${BINARY}" | awk '{print $1}')
        if [ "${ACTUAL}" != "${EXPECTED_SHA}" ]; then
          echo "::error::accelerator-server binary SHA-256 mismatch (cache poisoning?)."
          echo "  expected: ${EXPECTED_SHA}"
          echo "  actual:   ${ACTUAL}"
          echo "  binary:   ${BINARY}"
          echo "  Drop the cache + retry, or update the pin if upstream changed."
          exit 1
        fi
        echo "Binary SHA-256 verified: ${ACTUAL}"

    - name: Add to PATH
      shell: bash
      run: echo "${{ steps.paths.outputs.bin_dir }}" >> "$GITHUB_PATH"

    - name: Verify executable
      shell: bash
      run: |
        which accelerator-server
        ldd "$(which accelerator-server)" || true
