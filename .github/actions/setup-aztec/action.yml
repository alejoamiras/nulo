name: Setup Aztec
description: Install the Aztec CLI matching the @aztec/aztec.js version declared in apps/extension. Cached by version. The CLI installer provisions its own version-pinned Foundry (forge/anvil) into internal-bin with built-in retry.

inputs:
  skip_cli:
    description: Skip Foundry + Aztec CLI install (use when the test points at a remote node).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Detect Aztec version
      if: inputs.skip_cli != 'true'
      id: detect
      shell: bash
      run: |
        VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('apps/extension/package.json','utf8')).dependencies['@aztec/aztec.js'])")
        echo "Aztec version: $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Install Node.js 24
      if: inputs.skip_cli != 'true'
      uses: actions/setup-node@v6
      with:
        node-version: 24

    # NOTE: no foundry-rs/foundry-toolchain here (removed after a 502 from its
    # unpinned `foundryup` download killed a job). Its output (~/.foundry/bin)
    # was never consumed: @aztec/ethereum's resolveFoundryBinary hits the pin's
    # internal-bin (priority 2, provisioned below with the aztec installer's own
    # version-pinned + retry-wrapped foundry install) before ~/.foundry/bin
    # (priority 4) — and an unpinned system forge silently taking over would
    # break the L1 deploy anyway (version-forked `forge script --batch` args).
    # The preflight step below makes any installer regression fail loudly here
    # instead of mid-L1-deploy.

    # Cache key suffix v2: bumped when the foundry-toolchain step was removed so
    # one cold install certified the fresh path under the toolchain preflight.
    - name: Cache Aztec CLI
      if: inputs.skip_cli != 'true'
      id: cache-aztec
      uses: actions/cache@v6
      with:
        path: ~/.aztec/versions/${{ steps.detect.outputs.version }}
        key: ${{ runner.os }}-aztec-${{ steps.detect.outputs.version }}-v2

    - name: Install Aztec CLI
      if: inputs.skip_cli != 'true' && steps.cache-aztec.outputs.cache-hit != 'true'
      shell: bash
      env:
        AZTEC_VERSION: ${{ steps.detect.outputs.version }}
      run: |
        export CI=1
        curl -fsSL "https://install.aztec.network/${AZTEC_VERSION}/install" \
          | VERSION="$AZTEC_VERSION" bash
        ls -la ~/.aztec/versions/"$AZTEC_VERSION"/bin/

    # snappy@7.4.0 (published 2026-08-12) ships a broken Node entry chain — its
    # loader unconditionally reaches the platform-mismatched
    # @napi-rs/snappy-wasm32-wasi fallback, which npm never installs on linux,
    # so a FRESH toolchain install (the aztec installer resolves snappy
    # un-pinned) boots a node that dies at startup with ERR_MODULE_NOT_FOUND.
    # Load-check the installed snappy and, only when broken, replace it with
    # 7.3.3 (last known-good) by direct tarball extraction — npm-free, so
    # nothing else in the toolchain's tree gets re-resolved. Runs on BOTH the
    # cache-hit and fresh-install paths (no-op when snappy loads). Remove once
    # the aztec line ships with a fixed snappy resolution.
    - name: Pin snappy 7.3.3 when the installed one cannot load
      if: inputs.skip_cli != 'true'
      shell: bash
      env:
        AZTEC_VERSION: ${{ steps.detect.outputs.version }}
      run: |
        AZDIR="$HOME/.aztec/versions/${AZTEC_VERSION}"
        SNAPPY_DIR="$AZDIR/node_modules/snappy"
        if [ ! -d "$SNAPPY_DIR" ]; then
          echo "No snappy in the toolchain tree — nothing to pin."
          exit 0
        fi
        load_check() {
          node -e "const{createRequire}=require('module');const r=createRequire('$AZDIR/node_modules/');const s=r('snappy');process.exit(typeof s.compressSync==='function'?0:1)"
        }
        if load_check 2>/dev/null; then
          echo "snappy loads — no pin needed."
          exit 0
        fi
        echo "Installed snappy fails to load — pinning 7.3.3."
        TMP=$(mktemp -d)
        pushd "$TMP" > /dev/null
        npm pack snappy@7.3.3 @napi-rs/snappy-linux-x64-gnu@7.3.3 --silent
        mkdir -p s n
        tar -xzf snappy-7.3.3.tgz -C s
        tar -xzf napi-rs-snappy-linux-x64-gnu-7.3.3.tgz -C n
        popd > /dev/null
        rm -rf "$SNAPPY_DIR" "$AZDIR/node_modules/@napi-rs/snappy-linux-x64-gnu"
        mkdir -p "$AZDIR/node_modules/@napi-rs"
        mv "$TMP/s/package" "$SNAPPY_DIR"
        mv "$TMP/n/package" "$AZDIR/node_modules/@napi-rs/snappy-linux-x64-gnu"
        if ! load_check; then
          echo "::error::snappy still fails to load after pinning 7.3.3 — toolchain unusable."
          exit 1
        fi
        echo "snappy pinned to 7.3.3 and loads OK."

    # Fail-loud toolchain preflight, on BOTH the cache-hit and fresh-install
    # paths: the L1 deploy depends on the pin's bundled forge/anvil
    # (internal-bin outranks every other resolveFoundryBinary source once
    # `current` is symlinked). If a future aztec installer stops shipping them,
    # this step names the cause at setup instead of a confusing
    # missing-arguments failure mid-sandbox-boot.
    - name: Assert bundled Foundry toolchain
      if: inputs.skip_cli != 'true'
      shell: bash
      env:
        AZTEC_VERSION: ${{ steps.detect.outputs.version }}
      run: |
        BIN="$HOME/.aztec/versions/${AZTEC_VERSION}/internal-bin"
        for tool in forge anvil; do
          if [ ! -x "$BIN/$tool" ]; then
            echo "::error::aztec ${AZTEC_VERSION} install is missing executable internal-bin/$tool — the bundled Foundry toolchain regressed (or a partial cache was restored). Sandbox L1 deploys would fail."
            ls -la "$BIN" || true
            exit 1
          fi
          # Executable-bit alone can't catch a truncated/corrupt cached binary.
          if ! "$BIN/$tool" --version; then
            echo "::error::internal-bin/$tool exists but failed to run — corrupt binary or partial cache restore."
            exit 1
          fi
        done
        echo "Bundled toolchain OK: $BIN/{forge,anvil}"

    - name: Update PATH
      if: inputs.skip_cli != 'true'
      shell: bash
      env:
        AZTEC_VERSION: ${{ steps.detect.outputs.version }}
      run: |
        echo "$HOME/.aztec/versions/${AZTEC_VERSION}/bin" >> "$GITHUB_PATH"
        echo "$HOME/.aztec/versions/${AZTEC_VERSION}/node_modules/.bin" >> "$GITHUB_PATH"

    # global-setup.ts probes ~/.aztec/current/bin/aztec-anvil + ~/.aztec/current/node_modules/.bin/aztec.
    # (5.0 renamed bundled bare binaries to aztec-* on PATH — `anvil` is now `aztec-anvil`.)
    # The install above writes to ~/.aztec/versions/<version>/ but does NOT create
    # a `current` symlink (locally, `aztec-up` would). Without this, every CI
    # network-e2e run silently skips because global-setup falls through the
    # "binary not found" branch with aztecTestConfig undefined.
    - name: Symlink ~/.aztec/current
      if: inputs.skip_cli != 'true'
      shell: bash
      env:
        AZTEC_VERSION: ${{ steps.detect.outputs.version }}
      run: |
        ln -sfn "$HOME/.aztec/versions/${AZTEC_VERSION}" "$HOME/.aztec/current"
        ls -la "$HOME/.aztec/current/bin/aztec-anvil" "$HOME/.aztec/current/node_modules/.bin/aztec"
