name: Setup Aztec
description: |
  Install the Aztec CLI matching the @aztec-labs/aztec.js version declared in apps/extension,
  cached by version and pin set. The CLI installer provisions its own version-pinned Foundry
  (forge/anvil) into internal-bin with built-in retry.

  Trust posture: the per-version installer, its `versions` manifest and the noir release tarball
  that manifest names are SHA-256-pinned in `installer-pins.sha256` and checked before use; the
  installer runs from the verified file, never from a pipe, and takes the verified manifest and
  noir binaries through its `INSTALL_URI` and `NARGO` inputs, so it fetches neither itself. Two
  fetches stay unpinned because the installer has no input for them: Foundry's `curl
  https://foundry.paradigm.xyz | bash`, and the npm tree of `@aztec-labs/aztec` and
  `@aztec-labs/cli-wallet`, resolved with no lockfile and held to a 7-day release age outside the
  `@aztec-labs/*` and `@aztec-foundation/*` scopes. A version with no pin, or bytes that differ
  from one, fails the install step.

inputs:
  skip_cli:
    description: Skip Foundry + Aztec CLI install (use when the test points at a remote node).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Detect Aztec version
      if: inputs.skip_cli != 'true'
      id: detect
      shell: bash
      run: |
        VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('apps/extension/package.json','utf8')).dependencies['@aztec-labs/aztec.js'])")
        echo "Aztec version: $VERSION (from apps/extension)"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Install Node.js 24
      if: inputs.skip_cli != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    # NOTE: no foundry-rs/foundry-toolchain here (removed after a 502 from its
    # unpinned `foundryup` download killed a job). Its output (~/.foundry/bin)
    # was never consumed: @aztec-labs/ethereum's resolveFoundryBinary hits the pin's
    # internal-bin (priority 2, provisioned below with the aztec installer's own
    # version-pinned + retry-wrapped foundry install) before ~/.foundry/bin
    # (priority 4) — and an unpinned system forge silently taking over would
    # break the L1 deploy anyway (version-forked `forge script --batch` args).
    # The preflight step below makes any installer regression fail loudly here
    # instead of mid-L1-deploy.

    # A changed install path needs one cold install to certify it, so the key's suffix is bumped
    # whenever the install step changes (v3: the pinned installer), and the pin file's hash is in
    # the key so a re-pin certifies itself the same way instead of riding an older cache.
    - name: Cache Aztec CLI
      if: inputs.skip_cli != 'true'
      id: cache-aztec
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.aztec/versions/${{ steps.detect.outputs.version }}
        key: ${{ runner.os }}-aztec-${{ steps.detect.outputs.version }}-${{ hashFiles('.github/actions/setup-aztec/installer-pins.sha256') }}-v3

    # Every download is hashed against installer-pins.sha256 before it is used, and the installer
    # runs from the file that was hashed. The npm settings reach the installer's `npm install`,
    # whose tree has no lockfile; min-release-age-exclude needs npm 11.17.0, and an npm without
    # these settings only warns and resolves ungated.
    - name: Install Aztec CLI
      if: inputs.skip_cli != 'true' && steps.cache-aztec.outputs.cache-hit != 'true'
      shell: bash
      env:
        AZTEC_VERSION: ${{ steps.detect.outputs.version }}
      run: |
        set -euo pipefail
        export CI=1
        PINS="$GITHUB_ACTION_PATH/installer-pins.sha256"
        WORK=$(mktemp -d "$RUNNER_TEMP/aztec-install.XXXXXX")

        pin_for() {
          PIN=$(awk -v path="$1" '$2 == path { print $1 }' "$PINS")
          if ! [[ "$PIN" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::setup-aztec has no single SHA-256 pin for '$1' in .github/actions/setup-aztec/installer-pins.sha256. Re-pin for Aztec $AZTEC_VERSION (aztec-update skill, the pin surface)."
            exit 1
          fi
        }

        fetch() {
          local path="$1" url="$2" actual
          pin_for "$path"
          mkdir -p "$(dirname "$WORK/$path")"
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 -o "$WORK/$path" "$url"
          actual=$(sha256sum "$WORK/$path" | cut -d' ' -f1)
          if [ "$actual" != "$PIN" ]; then
            echo "::error::$url hashes to $actual, not its pin $PIN ('$path'). Upstream changed a pinned file: read the new bytes before re-pinning."
            exit 1
          fi
          echo "Verified $path: $actual"
        }

        at_least() {
          [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" = "$2" ]
        }

        fetch "$AZTEC_VERSION/install" "https://install.aztec-labs.com/$AZTEC_VERSION/install"
        fetch "$AZTEC_VERSION/versions" "https://install.aztec-labs.com/$AZTEC_VERSION/versions"
        NOIR_VERSION=$(awk '$1 == "noir:" { print $2 }' "$WORK/$AZTEC_VERSION/versions")
        NODE_MIN=$(awk '$1 == "node:" { print $2 }' "$WORK/$AZTEC_VERSION/versions")
        if [ -z "$NOIR_VERSION" ] || [ -z "$NODE_MIN" ]; then
          echo "::error::the pinned versions manifest of Aztec $AZTEC_VERSION names no noir or no node version."
          exit 1
        fi

        # Below its Node minimum the installer would install one through nvm, unpinned.
        NODE_HAVE=$(node --version | sed 's/^v//')
        if ! at_least "$NODE_HAVE" "$NODE_MIN"; then
          echo "::error::Node $NODE_HAVE is below the $NODE_MIN that Aztec $AZTEC_VERSION's installer requires: raise setup-node's version."
          exit 1
        fi
        NPM_HAVE=$(npm --version)
        if ! at_least "$NPM_HAVE" 11.17.0; then
          echo "::error::npm $NPM_HAVE predates min-release-age-exclude (11.17.0), which the installer's gated npm resolve needs."
          exit 1
        fi

        NOIR_ASSET=noir-x86_64-unknown-linux-gnu.tar.gz
        fetch "noir/$NOIR_VERSION/$NOIR_ASSET" \
          "https://github.com/noir-lang/noir/releases/download/v$NOIR_VERSION/$NOIR_ASSET"
        mkdir "$WORK/noir-bin"
        tar -xzf "$WORK/noir/$NOIR_VERSION/$NOIR_ASSET" -C "$WORK/noir-bin" ./nargo ./noir-profiler

        VERSION="$AZTEC_VERSION" INSTALL_URI="file://$WORK" NARGO="$WORK/noir-bin/nargo" \
          npm_config_min_release_age=7 \
          npm_config_min_release_age_exclude=$'@aztec-labs/*\n\n@aztec-foundation/*' \
          bash "$WORK/$AZTEC_VERSION/install"
        ls -la ~/.aztec/versions/"$AZTEC_VERSION"/bin/


    # Fail-loud toolchain preflight, on BOTH the cache-hit and fresh-install
    # paths: the L1 deploy depends on the pin's bundled forge/anvil
    # (internal-bin outranks every other resolveFoundryBinary source once
    # `current` is symlinked). If a future aztec installer stops shipping them,
    # this step names the cause at setup instead of a confusing
    # missing-arguments failure mid-sandbox-boot.
    - name: Assert bundled Foundry toolchain
      if: inputs.skip_cli != 'true'
      shell: bash
      env:
        AZTEC_VERSION: ${{ steps.detect.outputs.version }}
      run: |
        BIN="$HOME/.aztec/versions/${AZTEC_VERSION}/internal-bin"
        for tool in forge anvil; do
          if [ ! -x "$BIN/$tool" ]; then
            echo "::error::aztec ${AZTEC_VERSION} install is missing executable internal-bin/$tool — the bundled Foundry toolchain regressed (or a partial cache was restored). Sandbox L1 deploys would fail."
            ls -la "$BIN" || true
            exit 1
          fi
          # Executable-bit alone can't catch a truncated/corrupt cached binary.
          if ! "$BIN/$tool" --version; then
            echo "::error::internal-bin/$tool exists but failed to run — corrupt binary or partial cache restore."
            exit 1
          fi
        done
        echo "Bundled toolchain OK: $BIN/{forge,anvil}"

    - name: Update PATH
      if: inputs.skip_cli != 'true'
      shell: bash
      env:
        AZTEC_VERSION: ${{ steps.detect.outputs.version }}
      run: |
        echo "$HOME/.aztec/versions/${AZTEC_VERSION}/bin" >> "$GITHUB_PATH"
        echo "$HOME/.aztec/versions/${AZTEC_VERSION}/node_modules/.bin" >> "$GITHUB_PATH"

    # global-setup.ts probes ~/.aztec/current/bin/aztec-anvil + ~/.aztec/current/node_modules/.bin/aztec.
    # (5.0 renamed bundled bare binaries to aztec-* on PATH — `anvil` is now `aztec-anvil`.)
    # The install above writes to ~/.aztec/versions/<version>/ but does NOT create
    # a `current` symlink (locally, `aztec-up` would). Without this, every CI
    # network-e2e run silently skips because global-setup falls through the
    # "binary not found" branch with aztecTestConfig undefined.
    - name: Symlink ~/.aztec/current
      if: inputs.skip_cli != 'true'
      shell: bash
      env:
        AZTEC_VERSION: ${{ steps.detect.outputs.version }}
      run: |
        ln -sfn "$HOME/.aztec/versions/${AZTEC_VERSION}" "$HOME/.aztec/current"
        ls -la "$HOME/.aztec/current/bin/aztec-anvil" "$HOME/.aztec/current/node_modules/.bin/aztec"
